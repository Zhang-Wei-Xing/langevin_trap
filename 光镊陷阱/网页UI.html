<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Brownian Motion in a Trap</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --line-soft: #edf1f6;
      --text: #172033;
      --muted: #667085;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --green: #059669;
      --red: #dc2626;
      --amber: #b45309;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 10px 12px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      line-height: 1.1;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent-strong);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(260px, 312px) 1fr;
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 22px 18px;
      overflow: auto;
      max-height: 100vh;
    }

    main {
      min-width: 0;
      padding: 18px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 20px;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 4px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .subtle {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .model-note {
      margin: -6px 0 16px;
      padding: 10px 11px;
      border: 1px solid #e7edf5;
      border-radius: 7px;
      background: #fbfcfe;
      color: #475569;
      font-size: 12px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .control-group {
      border: 1px solid #e7edf5;
      border-radius: 8px;
      background: #fbfcfe;
      overflow: hidden;
    }

    .control-group summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 11px;
      color: #1f2937;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      list-style: none;
    }

    .control-group summary::-webkit-details-marker {
      display: none;
    }

    .control-group summary::after {
      content: "+";
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
    }

    .control-group[open] summary::after {
      content: "-";
    }

    .control-group-body {
      display: grid;
      gap: 10px;
      padding: 0 11px 11px;
    }

    .control {
      display: grid;
      grid-template-columns: 1fr 82px;
      gap: 8px 10px;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line-soft);
    }

    .control label {
      min-width: 0;
      color: #334155;
      font-size: 13px;
    }

    .control input[type="number"] {
      width: 82px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 7px;
      color: var(--text);
      background: #fff;
    }

    .control input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--accent);
    }

    .toggle-control {
      grid-template-columns: 1fr minmax(74px, 96px);
    }

    .toggle-control .control-hint {
      margin-top: -4px;
    }

    .toggle-button {
      min-height: 32px;
      border-color: var(--line);
      background: #fff;
      color: #334155;
      padding: 7px 10px;
    }

    .toggle-button:hover {
      background: #f8fafc;
    }

    .toggle-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .control-hint {
      grid-column: 1 / -1;
      margin: -2px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .derived {
      display: grid;
      gap: 7px;
      padding: 10px 0 0;
      color: #334155;
      font-size: 12px;
    }

    .derived div,
    .summary div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line-soft);
      padding-top: 7px;
    }

    .derived strong,
    .summary strong {
      text-align: right;
      font-weight: 750;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr minmax(98px, 122px) minmax(62px, 76px);
      gap: 8px;
      margin: 16px 0 12px;
    }

    .secondary-button {
      background: #ffffff;
      border-color: var(--line);
      color: #334155;
      padding-left: 8px;
      padding-right: 8px;
    }

    .secondary-button:hover {
      background: #f8fafc;
    }

    .status {
      min-height: 40px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #475569;
      background: #fbfcfe;
      font-size: 13px;
      line-height: 1.35;
    }

    .summary {
      display: grid;
      gap: 7px;
      margin-top: 12px;
      color: #334155;
      font-size: 13px;
    }

    .viewer {
      height: calc(100vh - 36px);
      min-height: 650px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      min-width: 0;
    }

    .viewer-top {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 14px;
      align-items: end;
    }

    .viewer-title p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .view-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .view-tab {
      min-height: 36px;
      border-color: var(--line);
      background: #fff;
      color: #334155;
      padding: 8px 11px;
    }

    .view-tab:hover {
      background: #f8fafc;
    }

    .view-tab.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .canvas-shell {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 1080px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .controls {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }

      .actions,
      .status,
      .summary,
      .model-note {
        max-width: 560px;
      }

      .viewer {
        height: 78vh;
        min-height: 560px;
      }
    }

    @media (max-width: 720px) {
      aside,
      main {
        padding: 14px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .viewer {
        height: 74vh;
        min-height: 500px;
      }

      .viewer-top {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .view-tabs {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>3D Brownian Trap</h1>
      <p class="subtle">过阻尼布朗粒子在三维谐振势井中运动。t、x(t)、y(t)、z(t) 只作为内部模拟序列，右侧展示轨迹、密度与统计图。</p>
      <p class="model-note">模型：γ0=6πηa，D0=kT/γ0；有墙时 h=z-z_wall+a，D_parallel/D0=1-9a/16h，D_perp/D0=1-9a/8h，γ_i=kT/D_i。更新式 dr_i=[(-κ_i r_i+F_i)/γ_i+(1-α)∂D_i/∂r_i]dt+sqrt(2D_i dt)w。</p>

      <section class="controls" id="controls"></section>

      <div class="actions">
        <button id="run" type="button">运行模拟</button>
        <button class="secondary-button" id="planeToggle" type="button">平面 x-y</button>
        <button class="secondary-button" id="download" type="button">PNG</button>
      </div>

      <div class="status" id="status">准备就绪。</div>
      <section class="summary" id="summary"></section>
    </aside>

    <main>
      <section class="viewer">
        <header class="viewer-top">
          <div class="viewer-title">
            <h2 id="viewTitle">3D trajectory</h2>
            <p id="viewSubtitle">x/y/z in nm</p>
          </div>
          <nav class="view-tabs" id="viewTabs" aria-label="图片视图切换"></nav>
        </header>
        <div class="canvas-shell">
          <canvas id="mainCanvas"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script>
    const controlSpecs = [
      { key: "kx", group: "trap", label: "kappa x (fN/nm)", value: 1.0, min: 0.02, max: 20, step: 0.01, scale: "log", hint: "x 方向势井刚度。对数滑块便于跨数量级调节；越大，束缚越紧，ACF 衰减时间 gamma/kappa 越短。" },
      { key: "ky", group: "trap", label: "kappa y (fN/nm)", value: 1.0, min: 0.02, max: 20, step: 0.01, scale: "log", hint: "y 方向势井刚度。对数滑块便于跨数量级调节；与 kx、kz 不同会形成各向异性的三维势井。" },
      { key: "kz", group: "trap", label: "kappa z (fN/nm)", value: 0.25, min: 0.02, max: 20, step: 0.01, scale: "log", hint: "z 方向势井刚度。对数滑块便于跨数量级调节；较小的 kz 会让轨迹沿 z 方向更宽。" },
      { key: "radius", group: "thermal", label: "a (μm)", value: 0.2, min: 0.02, max: 5, step: 0.01, scale: "log", hint: "粒子半径或硬墙水动力修正的特征尺度；默认 0.2 μm，也就是 200 nm。" },
      { key: "viscosity", group: "thermal", label: "η (Pa s)", value: 0.001, min: 0.0002, max: 0.02, step: 0.0001, scale: "log", hint: "介质黏稠度。对数滑块便于跨数量级调节；水在室温下约为 0.001 Pa s。" },
      { key: "temperature", group: "thermal", label: "T (K)", value: 300, min: 30, max: 3000, step: 1, scale: "log", hint: "热浴温度。对数滑块便于跨数量级调节；D 按 Einstein 关系 D=kT/gamma 自动更新。" },
      { key: "enableWall", group: "wall", label: "硬墙", type: "toggle", value: true, hint: "关闭时恢复无墙模拟：z 不受下限约束，D 在三方向均为 D0，墙标注不显示。" },
      { key: "wallZ", group: "wall", label: "wall z min (nm)", value: -200, min: -500, max: 500, step: 5, hint: "粒子中心的硬墙下限。默认 z_wall=-200 nm；当前选择范围收紧到 ±500 nm，匹配主要粒子活动范围。" },
      { key: "alpha", group: "wall", label: "α", value: 0, min: 0, max: 1, step: 0.05, hint: "随机积分约定参数。α=0 为 Ito 条件，α=1 为反 Ito 条件。" },
      { key: "enableForce", group: "force", label: "恒定力", type: "toggle", value: false, hint: "关闭时三个方向恒定力都按 0 处理；开启后每步按局部 mobility 加入恒力漂移。" },
      { key: "forceX", group: "force", label: "F x (fN)", value: 0, min: -50, max: 50, step: 0.1, hint: "x 方向恒定力。过阻尼更新中按局部 mobility 加入 Fx。" },
      { key: "forceY", group: "force", label: "F y (fN)", value: 0, min: -50, max: 50, step: 0.1, hint: "y 方向恒定力。势阱中会把平均位置平移约 Fy/kappa_y。" },
      { key: "forceZ", group: "force", label: "F z (fN)", value: 0, min: -50, max: 50, step: 0.1, hint: "z 方向恒定力。若硬墙开启，负向力会把粒子推向墙附近。" },
      { key: "dt", group: "numeric", label: "dt (ms)", value: 0.1, min: 0.01, max: 1, step: 0.001, scale: "log", hint: "数值时间步长。默认特征值为 0.1 ms；对数滑块便于在精度和速度之间调节。" },
      { key: "totalTime", group: "numeric", label: "total time T (ms)", value: 60000, min: 1000, max: 300000, step: 1000, scale: "log", hint: "模拟的物理总时间。默认拉长到 60000 ms；实际步数自动取 round(T/dt)。" },
      { key: "bins", group: "numeric", label: "density bins", value: 160, min: 64, max: 360, step: 4, hint: "概率密度图和 C/D 折线的空间采样数。默认调高以得到更细的曲线。" },
      { key: "ensembleSamples", group: "numeric", label: "ensemble / bin", value: 2048, min: 512, max: 32768, step: 256, scale: "log", hint: "C/D 每个位置 bin 单独发射的一步样本数；对数滑块便于在速度和折线噪声之间调节。" },
      { key: "seed", group: "numeric", label: "seed", value: -1, min: -1, max: 9999, step: 1, hint: "随机种子。设为 -1 会每次使用新的随机序列。" },
      { key: "x0", group: "initial", label: "initial x (nm)", value: 0.0, min: -500, max: 500, step: 5, hint: "初始 x 位置。统计默认使用完整轨迹。" },
      { key: "y0", group: "initial", label: "initial y (nm)", value: 0.0, min: -500, max: 500, step: 5, hint: "初始 y 位置。" },
      { key: "z0", group: "initial", label: "initial z (nm)", value: 0.0, min: -500, max: 500, step: 5, hint: "初始 z 位置。范围收紧到 ±500 nm，匹配主要粒子活动范围。" },
    ];

    const controlGroups = [
      { key: "trap", label: "势阱刚度", open: true },
      { key: "thermal", label: "热环境", open: true, derived: true },
      { key: "wall", label: "硬墙与随机约定", open: true },
      { key: "force", label: "恒定力", open: true },
      { key: "numeric", label: "数值与采样", open: false },
      { key: "initial", label: "初始位置", open: false },
    ];

    const BOLTZMANN_FN_NM_PER_K = 13.80649;
    const HYDRO_MIN_FACTOR = (9 / 8) * (1 + 1e-6);
    const DIFFUSION_FACTOR_FLOOR = 1e-6;
    const WALL_COLOR = "#b45309";
    const WALL_FILL = "rgba(180,83,9,0.11)";
    const axisMeta = [
      { key: "x", label: "x", color: "#2563eb" },
      { key: "y", label: "y", color: "#059669" },
      { key: "z", label: "z", color: "#dc2626" },
    ];
    const densityPlanes = [
      { key: "xy", label: "x-y", axes: [0, 1] },
      { key: "yz", label: "y-z", axes: [1, 2] },
      { key: "zx", label: "z-x", axes: [2, 0] },
    ];
    const viewConfigs = [
      { key: "trajectory", label: "3D轨迹", title: "3D trajectory", subtitle: "x/y/z in nm" },
      { key: "positionDistribution", label: "位置分布", title: "Position distribution", subtitle: "counts from simulated positions" },
      { key: "measuredDensity", label: "实测密度", title: "Measured density", subtitle: "histogram from simulated positions" },
      { key: "theoryDensity", label: "理论密度", title: "Fokker-Planck density", subtitle: "continuous equilibrium solution" },
      { key: "drift", label: "漂移 C", title: "Drift C(r)", subtitle: "ensemble line with analytic drift theory" },
      { key: "diffusion", label: "扩散 D", title: "Diffusion D(r)", subtitle: "ensemble line with analytic diffusion theory" },
      { key: "acf", label: "ACF", title: "Position autocorrelation", subtitle: "simulation and Ornstein-Uhlenbeck theory" },
      { key: "msd", label: "MSD", title: "Mean squared displacement", subtitle: "simulation and confined Brownian theory" },
    ];

    const controls = new Map();
    const controlsRoot = document.getElementById("controls");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const planeToggleEl = document.getElementById("planeToggle");
    const downloadEl = document.getElementById("download");
    const viewTabsEl = document.getElementById("viewTabs");
    const viewTitleEl = document.getElementById("viewTitle");
    const viewSubtitleEl = document.getElementById("viewSubtitle");
    const mainCanvas = document.getElementById("mainCanvas");
    let derivedReadoutEl = null;
    let densityPlaneIndex = 0;
    let activeViewKey = "trajectory";
    let simulationState = null;

    function createControls() {
      const groupBodies = new Map();
      for (const group of controlGroups) {
        const details = document.createElement("details");
        details.className = "control-group";
        details.open = group.open;

        const summary = document.createElement("summary");
        summary.textContent = group.label;

        const body = document.createElement("div");
        body.className = "control-group-body";
        details.append(summary, body);
        controlsRoot.append(details);
        groupBodies.set(group.key, body);
      }

      for (const spec of controlSpecs) {
        const wrap = document.createElement("div");
        wrap.className = "control";
        if (spec.type === "toggle") wrap.classList.add("toggle-control");

        const labelEl = document.createElement("label");
        labelEl.htmlFor = spec.type === "toggle" ? `${spec.key}-toggle` : `${spec.key}-range`;
        labelEl.textContent = spec.label;

        if (spec.type === "toggle") {
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "toggle-button";
          toggle.id = `${spec.key}-toggle`;
          setToggle(toggle, Boolean(spec.value));
          toggle.addEventListener("click", () => {
            setToggle(toggle, toggle.dataset.on !== "true");
            updateDerivedReadout();
          });

          const hintEl = document.createElement("p");
          hintEl.className = "control-hint";
          hintEl.textContent = spec.hint;

          wrap.append(labelEl, toggle, hintEl);
          groupBodies.get(spec.group).append(wrap);
          controls.set(spec.key, { toggle, spec });
          continue;
        }

        const number = document.createElement("input");
        number.type = "number";
        number.id = `${spec.key}-number`;
        number.min = spec.min;
        number.max = spec.max;
        number.step = spec.step;
        number.value = formatControlValue(spec.value, spec);

        const range = document.createElement("input");
        range.type = "range";
        range.id = `${spec.key}-range`;
        range.min = isLogScale(spec) ? 0 : spec.min;
        range.max = isLogScale(spec) ? 1 : spec.max;
        range.step = isLogScale(spec) ? (spec.sliderStep || 0.001) : spec.step;
        range.value = valueToRangePosition(spec.value, spec);

        const syncFromRange = () => {
          const value = rangePositionToValue(range.value, spec);
          number.value = formatControlValue(value, spec);
          updateDerivedReadout();
        };
        const syncFromNumber = () => {
          const value = clampControlValue(Number(number.value), spec);
          number.value = formatControlValue(value, spec);
          range.value = valueToRangePosition(value, spec);
          updateDerivedReadout();
        };
        range.addEventListener("input", syncFromRange);
        number.addEventListener("input", syncFromNumber);

        const hintEl = document.createElement("p");
        hintEl.className = "control-hint";
        hintEl.textContent = spec.hint;

        wrap.append(labelEl, number, range, hintEl);
        groupBodies.get(spec.group).append(wrap);
        controls.set(spec.key, { range, number, spec });
      }

      const thermalBody = groupBodies.get("thermal");
      if (thermalBody) {
        derivedReadoutEl = document.createElement("section");
        derivedReadoutEl.className = "derived";
        thermalBody.append(derivedReadoutEl);
      }
      updateDerivedReadout();
    }

    function isLogScale(spec) {
      return spec.scale === "log" && spec.min > 0 && spec.max > spec.min;
    }

    function clampControlValue(value, spec) {
      const fallback = Number.isFinite(spec.value) ? spec.value : spec.min;
      const finiteValue = Number.isFinite(value) ? value : fallback;
      return Math.min(spec.max, Math.max(spec.min, finiteValue));
    }

    function rangePositionToValue(position, spec) {
      if (!isLogScale(spec)) return clampControlValue(Number(position), spec);
      const t = Math.min(1, Math.max(0, Number(position)));
      const minLog = Math.log10(spec.min);
      const maxLog = Math.log10(spec.max);
      return snapControlValue(10 ** (minLog + t * (maxLog - minLog)), spec);
    }

    function valueToRangePosition(value, spec) {
      const clamped = clampControlValue(value, spec);
      if (!isLogScale(spec)) return clamped;
      const minLog = Math.log10(spec.min);
      const maxLog = Math.log10(spec.max);
      return (Math.log10(clamped) - minLog) / Math.max(maxLog - minLog, 1e-12);
    }

    function snapControlValue(value, spec) {
      if (!Number.isFinite(spec.step) || spec.step <= 0) return clampControlValue(value, spec);
      const snapped = spec.min + Math.round((value - spec.min) / spec.step) * spec.step;
      return clampControlValue(snapped, spec);
    }

    function controlDecimals(step) {
      const text = String(step);
      if (text.includes("e-")) return Number(text.split("e-")[1]);
      const dot = text.indexOf(".");
      return dot === -1 ? 0 : text.length - dot - 1;
    }

    function formatControlValue(value, spec) {
      const clamped = snapControlValue(clampControlValue(value, spec), spec);
      const decimals = controlDecimals(spec.step);
      return decimals > 0 ? Number(clamped.toFixed(decimals)).toString() : String(Math.round(clamped));
    }

    function setToggle(button, enabled) {
      button.dataset.on = enabled ? "true" : "false";
      button.classList.toggle("active", enabled);
      button.setAttribute("aria-pressed", enabled ? "true" : "false");
      button.textContent = enabled ? "开启" : "关闭";
    }

    function createViewTabs() {
      viewTabsEl.innerHTML = "";
      for (const view of viewConfigs) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "view-tab";
        button.dataset.viewKey = view.key;
        button.textContent = view.label;
        button.addEventListener("click", () => {
          activeViewKey = view.key;
          Presentation.renderCurrentView();
        });
        viewTabsEl.append(button);
      }
    }

    function valueOf(key) {
      const control = controls.get(key);
      if (control.spec.type === "toggle") return control.toggle.dataset.on === "true" ? 1 : 0;
      return Number(control.number.value);
    }

    function enabled(key) {
      return valueOf(key) > 0;
    }

    function thermalFromControls() {
      const radiusUm = Math.max(1e-6, valueOf("radius"));
      const radiusNm = radiusUm * 1000;
      const viscosity = Math.max(1e-9, valueOf("viscosity"));
      const temperature = Math.max(1e-9, valueOf("temperature"));
      const thermalEnergy = BOLTZMANN_FN_NM_PER_K * temperature;
      const gamma0 = 6 * Math.PI * viscosity * radiusUm * 1000;
      const diffusion0 = thermalEnergy / gamma0;
      return {
        radiusUm,
        radiusNm,
        viscosity,
        temperature,
        thermalEnergy,
        gamma0,
        diffusion0,
        gamma: gamma0,
        diffusion: diffusion0,
      };
    }

    function updateDerivedReadout() {
      if (!derivedReadoutEl || !controls.has("radius")) return;
      const params = paramsFromControls();
      const rows = [
        ["γ0", `${params.gamma0.toPrecision(5)} fN ms/nm`],
        ["D0", `${params.diffusion0.toPrecision(5)} nm²/ms`],
      ];
      if (params.wallEnabled) {
        const z0 = Math.max(params.initial[2], params.wallZ);
        const localD = localDiffusionAtZ(z0, params);
        rows.push(
          ["D∥ at z0", `${localD.parallel.toPrecision(5)} nm²/ms`],
          ["D⊥ at z0", `${localD.perpendicular.toPrecision(5)} nm²/ms`],
          ["γ∥ at z0", `${localD.gammaParallel.toPrecision(5)} fN ms/nm`],
          ["γ⊥ at z0", `${localD.gammaPerpendicular.toPrecision(5)} fN ms/nm`],
        );
      }
      derivedReadoutEl.innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`).join("");
    }

    function paramsFromControls() {
      const dt = Math.max(0.0001, valueOf("dt"));
      const requestedTime = Math.max(dt * 2, valueOf("totalTime"));
      const steps = Math.max(2, Math.round(requestedTime / dt));
      const thermal = thermalFromControls();
      const alpha = Math.max(0, Math.min(1, valueOf("alpha")));
      const wallEnabled = enabled("enableWall");
      const forceEnabled = enabled("enableForce");
      const wallZ = valueOf("wallZ");
      const force = forceEnabled ? [valueOf("forceX"), valueOf("forceY"), valueOf("forceZ")] : [0, 0, 0];
      return {
        kappa: [valueOf("kx"), valueOf("ky"), valueOf("kz")],
        gamma0: thermal.gamma0,
        diffusion0: thermal.diffusion0,
        gamma: thermal.gamma0,
        diffusion: thermal.diffusion0,
        thermalEnergy: thermal.thermalEnergy,
        radiusUm: thermal.radiusUm,
        radiusNm: thermal.radiusNm,
        viscosity: thermal.viscosity,
        temperature: thermal.temperature,
        wallEnabled,
        wallZ,
        alpha,
        forceEnabled,
        force,
        dt,
        totalTime: requestedTime,
        steps,
        effectiveTime: steps * dt,
        bins: Math.round(valueOf("bins")),
        ensembleSamples: Math.max(1, Math.round(valueOf("ensembleSamples"))),
        seed: Math.round(valueOf("seed")),
        initial: [valueOf("x0"), valueOf("y0"), valueOf("z0")],
      };
    }

    function localDiffusionAtZ(zValue, params) {
      const gammaFromDiffusion = (diffusion) => (
        diffusion > 0 ? params.thermalEnergy / diffusion : Infinity
      );
      if (!params.wallEnabled) {
        return {
          h: Infinity,
          parallel: params.diffusion,
          perpendicular: params.diffusion,
          parallelFactor: 1,
          perpendicularFactor: 1,
          gammaParallel: params.gamma,
          gammaPerpendicular: params.gamma,
          dPerpendicularDz: 0,
        };
      }
      const hRaw = zValue - params.wallZ + params.radiusNm;
      const h = Math.max(hRaw, params.radiusNm * HYDRO_MIN_FACTOR, 1e-9);
      const parallelFactor = Math.max(DIFFUSION_FACTOR_FLOOR, 1 - (9 * params.radiusNm) / (16 * h));
      const perpendicularFactor = Math.max(DIFFUSION_FACTOR_FLOOR, 1 - (9 * params.radiusNm) / (8 * h));
      return {
        h,
        parallel: params.diffusion * parallelFactor,
        perpendicular: params.diffusion * perpendicularFactor,
        parallelFactor,
        perpendicularFactor,
        gammaParallel: gammaFromDiffusion(params.diffusion * parallelFactor),
        gammaPerpendicular: gammaFromDiffusion(params.diffusion * perpendicularFactor),
        dPerpendicularDz: params.diffusion * (9 * params.radiusNm) / (8 * h * h),
      };
    }

    function reflectWall(value, wallZ) {
      return value < wallZ ? wallZ + (wallZ - value) : value;
    }

    function erf(value) {
      const sign = value < 0 ? -1 : 1;
      const x = Math.abs(value);
      const t = 1 / (1 + 0.3275911 * x);
      const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
      return sign * y;
    }

    function normalCdf(value) {
      return 0.5 * (1 + erf(value / Math.SQRT2));
    }

    function normalPdf(value) {
      return Math.exp(-0.5 * value * value) / Math.sqrt(2 * Math.PI);
    }

    function equilibriumDensity1D(value, axisIndex, sigma, params) {
      if (!Number.isFinite(sigma) || sigma <= 0) return 0;
      if (params.wallEnabled && axisIndex === 2 && value < params.wallZ) return 0;
      const center = equilibriumCenter(axisIndex, params);
      const normalized = (value - center) / sigma;
      const baseDensity = Math.exp(-0.5 * normalized * normalized) / (sigma * Math.sqrt(2 * Math.PI));
      if (!params.wallEnabled || axisIndex !== 2) return baseDensity;
      const tail = Math.max(1 - normalCdf((params.wallZ - center) / sigma), 1e-12);
      return baseDensity / tail;
    }

    function equilibriumCenter(axisIndex, params) {
      const kappa = Math.max(params.kappa[axisIndex], 1e-12);
      return params.force[axisIndex] / kappa;
    }

    function equilibriumMoments1D(axisIndex, sigma, params) {
      const mean = equilibriumCenter(axisIndex, params);
      if (!Number.isFinite(sigma) || sigma <= 0) return { mean, std: 0 };
      if (!params.wallEnabled || axisIndex !== 2) return { mean, std: sigma };

      const lower = (params.wallZ - mean) / sigma;
      const tail = Math.max(1 - normalCdf(lower), 1e-12);
      const lambda = normalPdf(lower) / tail;
      const variance = sigma * sigma * Math.max(0, 1 + lower * lambda - lambda * lambda);
      return {
        mean: mean + sigma * lambda,
        std: Math.sqrt(variance),
      };
    }

    const Simulation = (() => {
      function mulberry32(seed) {
        let t = seed >>> 0;
        return function next() {
          t += 0x6D2B79F5;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      function gaussian(rng) {
        let u = 0;
        let v = 0;
        while (u === 0) u = rng();
        while (v === 0) v = rng();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      }

      function rngFromSeed(seed, salt = 0) {
        return seed < 0 ? Math.random : mulberry32((Math.round(seed) + salt) >>> 0);
      }

      function stepOnce(xPrevious, yPrevious, zPrevious, params, rng, out) {
        const localD = localDiffusionAtZ(zPrevious, params);
        const xyNoise = Math.sqrt(2 * localD.parallel * params.dt);
        const zNoise = Math.sqrt(2 * localD.perpendicular * params.dt);
        out[0] = xPrevious + ((-params.kappa[0] * xPrevious + params.force[0]) / localD.gammaParallel) * params.dt + xyNoise * gaussian(rng);
        out[1] = yPrevious + ((-params.kappa[1] * yPrevious + params.force[1]) / localD.gammaParallel) * params.dt + xyNoise * gaussian(rng);
        const zCandidate = zPrevious + (
          ((-params.kappa[2] * zPrevious + params.force[2]) / localD.gammaPerpendicular) +
          (1 - params.alpha) * localD.dPerpendicularDz
        ) * params.dt + zNoise * gaussian(rng);
        out[2] = params.wallEnabled ? reflectWall(zCandidate, params.wallZ) : zCandidate;
        return out;
      }

      function run(params) {
        const rng = rngFromSeed(params.seed);
        const count = params.steps + 1;
        const time = new Float64Array(count);
        const x = new Float64Array(count);
        const y = new Float64Array(count);
        const z = new Float64Array(count);
        const xyz = new Float64Array(count * 3);
        const axes = [x, y, z];
        x[0] = params.initial[0];
        y[0] = params.initial[1];
        z[0] = params.wallEnabled ? Math.max(params.initial[2], params.wallZ) : params.initial[2];
        xyz[0] = x[0];
        xyz[1] = y[0];
        xyz[2] = z[0];

        const next = [0, 0, 0];
        for (let i = 1; i < count; i += 1) {
          time[i] = i * params.dt;
          const xPrevious = x[i - 1];
          const yPrevious = y[i - 1];
          const zPrevious = z[i - 1];
          stepOnce(xPrevious, yPrevious, zPrevious, params, rng, next);
          x[i] = next[0];
          y[i] = next[1];
          z[i] = next[2];
          xyz[i * 3] = x[i];
          xyz[i * 3 + 1] = y[i];
          xyz[i * 3 + 2] = z[i];
        }

        return {
          length: count,
          time,
          x,
          y,
          z,
          positions: { t: time, x, y, z },
          axes,
          xyz,
        };
      }

      return { run, stepOnce, rngFromSeed };
    })();

    const Analysis = (() => {
      function analyze(simulation, params) {
        const start = 0;
        const n = simulation.length - start;
        const mean = [0, 0, 0];
        const variance = [0, 0, 0];
        const min = [Infinity, Infinity, Infinity];
        const max = [-Infinity, -Infinity, -Infinity];

        for (let axis = 0; axis < 3; axis += 1) {
          const data = simulation.axes[axis];
          for (let i = start; i < simulation.length; i += 1) {
            mean[axis] += data[i];
            min[axis] = Math.min(min[axis], data[i]);
            max[axis] = Math.max(max[axis], data[i]);
          }
          mean[axis] /= n;
          for (let i = start; i < simulation.length; i += 1) {
            const delta = data[i] - mean[axis];
            variance[axis] += delta * delta;
          }
        }

        const measuredVariance = variance.map((v) => v / n);
        const std = measuredVariance.map((v) => Math.sqrt(v));
        const sigma = params.kappa.map((k) => Math.sqrt(params.diffusion * params.gamma / k));
        const theoryMoments = sigma.map((value, axis) => equilibriumMoments1D(axis, value, params));
        const theoryMean = theoryMoments.map((moment) => moment.mean);
        const theoryStd = theoryMoments.map((moment) => moment.std);
        const kappaFromVariance = measuredVariance.map((value, axis) => {
          if (params.wallEnabled && axis === 2) return null;
          return value > 0 ? (params.diffusion * params.gamma) / value : NaN;
        });
        return { start, n, mean, variance: measuredVariance, std, sigma, theoryMean, theoryStd, kappaFromVariance, min, max };
      }

      function slowestRelaxationTime(params) {
        const minKappa = Math.max(Math.min(...params.kappa), 1e-12);
        return params.gamma / minKappa;
      }

      function sampledLags(maxLag, count, linearFraction = 0.35) {
        const cappedMaxLag = Math.max(1, Math.round(maxLag));
        if (cappedMaxLag <= count) return Array.from({ length: cappedMaxLag }, (_, index) => index + 1);
        const lags = new Set([1, cappedMaxLag]);
        const linearCount = Math.max(12, Math.round(count * linearFraction));
        const linearMax = Math.max(1, Math.round(cappedMaxLag * 0.16));
        for (let i = 0; i < linearCount; i += 1) {
          const t = linearCount === 1 ? 1 : i / (linearCount - 1);
          lags.add(Math.max(1, Math.round(1 + (linearMax - 1) * t)));
        }
        const logCount = Math.max(1, count - linearCount);
        for (let i = 0; i < logCount; i += 1) {
          const t = logCount === 1 ? 1 : i / (logCount - 1);
          lags.add(Math.max(1, Math.round(Math.exp(Math.log(cappedMaxLag) * t))));
        }
        return [...lags].sort((a, b) => a - b);
      }

      function acfByAxis(simulation, params, analysis) {
        const relaxationWindow = Math.ceil((8 * slowestRelaxationTime(params)) / params.dt);
        const maxLag = Math.min(analysis.n - 1, Math.max(1400, relaxationWindow));
        const lags = sampledLags(maxLag, 220, 0.42);
        const values = axisMeta.map(() => [[0, 1]]);
        const variance = analysis.std.map((s) => s * s);
        for (const lag of lags) {
          const pairCount = params.steps - lag - analysis.start + 1;
          if (pairCount <= 0) continue;
          const stride = Math.max(1, Math.floor(pairCount / 5000));
          for (let axis = 0; axis < 3; axis += 1) {
            const data = simulation.axes[axis];
            let numerator = 0;
            let count = 0;
            for (let i = analysis.start; i <= params.steps - lag; i += stride) {
              numerator += (data[i] - analysis.mean[axis]) * (data[i + lag] - analysis.mean[axis]);
              count += 1;
            }
            const corr = variance[axis] > 0 && count > 0 ? (numerator / count) / variance[axis] : 0;
            values[axis].push([lag * params.dt, corr]);
          }
        }
        return values;
      }

      function msdByAxis(simulation, params, analysis) {
        const relaxationWindow = Math.ceil((8 * slowestRelaxationTime(params)) / params.dt);
        const maxLag = Math.max(1, Math.min(Math.floor(analysis.n / 2), Math.max(4200, relaxationWindow)));
        const lags = sampledLags(maxLag, 110, 0.16);
        const values = axisMeta.map(() => []);
        for (const lag of lags) {
          const total = [0, 0, 0];
          let count = 0;
          const pairCount = params.steps - lag - analysis.start + 1;
          if (pairCount <= 0) continue;
          const stride = Math.max(1, Math.floor(pairCount / 6000));
          for (let i = analysis.start; i <= params.steps - lag; i += stride) {
            for (let axis = 0; axis < 3; axis += 1) {
              const data = simulation.axes[axis];
              const delta = data[i + lag] - data[i];
              total[axis] += delta * delta;
            }
            count += 1;
          }
          for (let axis = 0; axis < 3; axis += 1) {
            values[axis].push([lag * params.dt, Math.max(total[axis] / count, 1e-12)]);
          }
        }
        return values;
      }

      function theoryAcfByAxis(dataByAxis, params) {
        return dataByAxis.map((data, axis) => data.map(([lag]) => {
          const value = Math.exp(-(params.kappa[axis] / params.gamma) * lag);
          return [lag, value];
        }));
      }

      function theoryMsdByAxis(dataByAxis, params, analysis) {
        return dataByAxis.map((data, axis) => data.map(([lag]) => {
          const lambda = params.kappa[axis] / params.gamma;
          const sigma = analysis.sigma[axis];
          const value = 2 * sigma * sigma * (1 - Math.exp(-lambda * lag));
          return [lag, Math.max(value, 1e-12)];
        }));
      }

      function commonDensityExtent(simulation, params, analysis, axisX, axisY) {
        let span = Math.max(3.5 * analysis.sigma[axisX], 3.5 * analysis.sigma[axisY]);
        span = Math.max(span, Math.abs(equilibriumCenter(axisX, params)), Math.abs(equilibriumCenter(axisY, params)));
        if (params.wallEnabled && (axisX === 2 || axisY === 2)) span = Math.max(span, Math.abs(params.wallZ));
        const xData = simulation.axes[axisX];
        const yData = simulation.axes[axisY];
        const stride = Math.max(1, Math.floor(analysis.n / 16000));
        for (let i = analysis.start; i < simulation.length; i += stride) {
          span = Math.max(span, Math.abs(xData[i]), Math.abs(yData[i]));
        }
        span = Math.max(span, 1e-6);
        return { spanX: span, spanY: span };
      }

      function density(simulation, params, analysis, axisX, axisY, extent) {
        const bins = params.bins;
        const grid = Array.from({ length: bins }, () => new Float64Array(bins));
        const spanX = extent.spanX;
        const spanY = extent.spanY;
        const xData = simulation.axes[axisX];
        const yData = simulation.axes[axisY];
        for (let i = analysis.start; i < simulation.length; i += 1) {
          const gx = Math.floor(((xData[i] + spanX) / (2 * spanX)) * bins);
          const gy = Math.floor(((yData[i] + spanY) / (2 * spanY)) * bins);
          if (gx >= 0 && gx < bins && gy >= 0 && gy < bins) grid[gy][gx] += 1;
        }
        const cellArea = (2 * spanX / bins) * (2 * spanY / bins);
        const normalizer = Math.max(analysis.n * cellArea, 1e-12);
        for (const row of grid) {
          for (let i = 0; i < row.length; i += 1) row[i] /= normalizer;
        }
        return { grid: smoothGrid(grid), spanX, spanY };
      }

      function axisHistogramSpan(simulation, params, analysis, axisIndex) {
        const data = simulation.axes[axisIndex];
        let span = Math.max(3.5 * analysis.sigma[axisIndex], 1e-6);
        span = Math.max(span, Math.abs(equilibriumCenter(axisIndex, params)));
        if (params.wallEnabled && axisIndex === 2) span = Math.max(span, Math.abs(params.wallZ));
        for (let i = analysis.start; i < simulation.length; i += 1) {
          span = Math.max(span, Math.abs(data[i]));
        }
        return niceStep(span / 3.5) * 3.5;
      }

      function positionHistogram(simulation, params, analysis, axisIndex) {
        const bins = params.bins;
        const data = simulation.axes[axisIndex];
        const span = axisHistogramSpan(simulation, params, analysis, axisIndex);
        const counts = new Uint32Array(bins);
        for (let i = analysis.start; i < simulation.length; i += 1) {
          const raw = Math.floor(((data[i] + span) / (2 * span)) * bins);
          const bin = raw === bins ? bins - 1 : raw;
          if (bin >= 0 && bin < bins) counts[bin] += 1;
        }
        let maxCount = 0;
        for (const count of counts) maxCount = Math.max(maxCount, count);
        return {
          axisIndex,
          counts,
          span,
          binWidth: (2 * span) / bins,
          total: analysis.n,
          maxCount,
        };
      }

      function coordinateCutStart(axisIndex, value, params, out) {
        out[0] = equilibriumCenter(0, params);
        out[1] = equilibriumCenter(1, params);
        out[2] = equilibriumCenter(2, params);
        if (params.wallEnabled) out[2] = Math.max(out[2], params.wallZ);
        out[axisIndex] = value;
        return out;
      }

      function conditionalMomentTheoryAt(value, axisIndex, params) {
        if (params.wallEnabled && axisIndex === 2 && value < params.wallZ) return null;
        const start = coordinateCutStart(axisIndex, value, params, [0, 0, 0]);
        const localD = localDiffusionAtZ(start[2], params);
        const diffusion = axisIndex === 2 ? localD.perpendicular : localD.parallel;
        const gamma = axisIndex === 2 ? localD.gammaPerpendicular : localD.gammaParallel;
        const drift = (
          ((-params.kappa[axisIndex] * start[axisIndex] + params.force[axisIndex]) / gamma) +
          (axisIndex === 2 ? (1 - params.alpha) * localD.dPerpendicularDz : 0)
        );
        return {
          drift,
          diffusion,
        };
      }

      function conditionalMomentHistogram(simulation, params, analysis, axisIndex) {
        const bins = params.bins;
        const span = axisHistogramSpan(simulation, params, analysis, axisIndex);
        const positions = new Float64Array(bins);
        const counts = new Uint32Array(bins);
        const driftValues = new Float64Array(bins);
        const diffusionValues = new Float64Array(bins);
        const driftTheory = new Float64Array(bins);
        const diffusionTheory = new Float64Array(bins);
        driftTheory.fill(NaN);
        diffusionTheory.fill(NaN);
        const binWidth = (2 * span) / bins;
        const samples = Math.max(1, params.ensembleSamples || 1024);
        const rng = Simulation.rngFromSeed(params.seed, 0x9E3779B9 + axisIndex * 0x85EBCA6B);
        const start = [0, 0, 0];
        const next = [0, 0, 0];

        let driftMaxAbs = 0;
        let diffusionMax = 0;
        let total = 0;
        for (let i = 0; i < bins; i += 1) {
          const value = -span + (i + 0.5) * binWidth;
          positions[i] = value;
          if (params.wallEnabled && axisIndex === 2 && value < params.wallZ) continue;
          coordinateCutStart(axisIndex, value, params, start);
          const theory = conditionalMomentTheoryAt(value, axisIndex, params);
          if (theory) {
            driftTheory[i] = theory.drift;
            diffusionTheory[i] = theory.diffusion;
            driftMaxAbs = Math.max(driftMaxAbs, Math.abs(theory.drift));
            diffusionMax = Math.max(diffusionMax, theory.diffusion);
          }

          let driftSum = 0;
          let diffusionSum = 0;
          for (let sample = 0; sample < samples; sample += 1) {
            Simulation.stepOnce(start[0], start[1], start[2], params, rng, next);
            const delta = next[axisIndex] - start[axisIndex];
            driftSum += delta;
            diffusionSum += delta * delta;
          }

          counts[i] = samples;
          total += samples;
          driftValues[i] = (driftSum / samples) / params.dt;
          diffusionValues[i] = (diffusionSum / samples) / (2 * params.dt);
          driftMaxAbs = Math.max(driftMaxAbs, Math.abs(driftValues[i]));
          diffusionMax = Math.max(diffusionMax, diffusionValues[i]);
        }

        return {
          axisIndex,
          positions,
          counts,
          driftValues,
          diffusionValues,
          driftTheory,
          diffusionTheory,
          span,
          binWidth,
          total,
          ensembleSamples: samples,
          driftMaxAbs,
          diffusionMax,
        };
      }

      function conditionalMomentHistograms(simulation, params, analysis) {
        return axisMeta.map((_, axisIndex) => conditionalMomentHistogram(simulation, params, analysis, axisIndex));
      }

      function fokkerPlanckDensity(params, analysis, axisX, axisY, extent) {
        const bins = params.bins;
        const sigmaX = analysis.sigma[axisX];
        const sigmaY = analysis.sigma[axisY];
        const spanX = extent.spanX;
        const spanY = extent.spanY;
        const grid = Array.from({ length: bins }, () => new Float64Array(bins));
        for (let gy = 0; gy < bins; gy += 1) {
          const y = -spanY + ((gy + 0.5) / bins) * 2 * spanY;
          for (let gx = 0; gx < bins; gx += 1) {
            const x = -spanX + ((gx + 0.5) / bins) * 2 * spanX;
            grid[gy][gx] = equilibriumDensity1D(x, axisX, sigmaX, params) * equilibriumDensity1D(y, axisY, sigmaY, params);
          }
        }
        return { grid, spanX, spanY };
      }

      return {
        analyze,
        acfByAxis,
        msdByAxis,
        theoryAcfByAxis,
        theoryMsdByAxis,
        commonDensityExtent,
        density,
        positionHistogram,
        conditionalMomentHistogram,
        conditionalMomentHistograms,
        conditionalMomentTheoryAt,
        fokkerPlanckDensity,
      };
    })();

    const Presentation = (() => {
      function renderCurrentView() {
        const view = viewConfigs.find((item) => item.key === activeViewKey) || viewConfigs[0];
        viewTitleEl.textContent = view.title;
        viewSubtitleEl.textContent = subtitleForView(view);
        planeToggleEl.textContent = `${togglePrefixForView(view.key)} ${currentDensityPlane().label}`;
        for (const button of viewTabsEl.querySelectorAll(".view-tab")) {
          button.classList.toggle("active", button.dataset.viewKey === view.key);
        }

        if (!simulationState) {
          const canvas = setupCanvas(mainCanvas);
          drawFrame(canvas.ctx, canvas.width, canvas.height);
          return;
        }

        if (view.key === "trajectory") drawTrajectory(mainCanvas, simulationState);
        if (view.key === "positionDistribution") drawPositionDistribution(mainCanvas, simulationState);
        if (view.key === "measuredDensity") drawDensityProjection(mainCanvas, simulationState, "measured");
        if (view.key === "theoryDensity") drawDensityProjection(mainCanvas, simulationState, "theory");
        if (view.key === "drift") drawConditionalStatistic(mainCanvas, simulationState, "drift");
        if (view.key === "diffusion") drawConditionalStatistic(mainCanvas, simulationState, "diffusion");
        if (view.key === "acf") drawAcf(mainCanvas, simulationState);
        if (view.key === "msd") drawMsd(mainCanvas, simulationState);
      }

      function subtitleForView(view) {
        if (view.key === "measuredDensity" || view.key === "theoryDensity") {
          return `${view.subtitle}; current plane ${currentDensityPlane().label}`;
        }
        if (view.key === "positionDistribution" || view.key === "drift" || view.key === "diffusion") {
          return `${view.subtitle}; current axes ${currentDensityPlane().label}`;
        }
        return view.subtitle;
      }

      return { renderCurrentView };
    })();

    function smoothGrid(grid) {
      const h = grid.length;
      const w = grid[0].length;
      const kernel = [0.054, 0.244, 0.403, 0.244, 0.054];
      const temp = Array.from({ length: h }, () => new Float64Array(w));
      const out = Array.from({ length: h }, () => new Float64Array(w));
      for (let y = 0; y < h; y += 1) {
        for (let x = 0; x < w; x += 1) {
          let sum = 0;
          for (let k = -2; k <= 2; k += 1) {
            const sx = Math.min(w - 1, Math.max(0, x + k));
            sum += grid[y][sx] * kernel[k + 2];
          }
          temp[y][x] = sum;
        }
      }
      for (let y = 0; y < h; y += 1) {
        for (let x = 0; x < w; x += 1) {
          let sum = 0;
          for (let k = -2; k <= 2; k += 1) {
            const sy = Math.min(h - 1, Math.max(0, y + k));
            sum += temp[sy][x] * kernel[k + 2];
          }
          out[y][x] = sum;
        }
      }
      return out;
    }

    function setupCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      const width = Math.max(260, Math.floor(rect.width * scale));
      const height = Math.max(260, Math.floor(rect.height * scale));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, width, height);
      return { ctx, width, height, scale };
    }

    function drawFrame(ctx, width, height) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
    }

    function drawTrajectory(canvas, state) {
      const { simulation, params, analysis } = state;
      const { ctx, width, height, scale } = setupCanvas(canvas);
      drawFrame(ctx, width, height);
      const pad = Math.max(50 * scale, Math.min(width, height) * 0.09);
      const cx = width * 0.51;
      const cy = height * 0.51;
      let span = Math.max(0.45, ...analysis.sigma.map((s) => 2.4 * s));
      const strideForSpan = Math.max(1, Math.floor(analysis.n / 7000));
      for (let i = analysis.start; i < simulation.length; i += strideForSpan) {
        span = Math.max(span, Math.abs(simulation.x[i]), Math.abs(simulation.y[i]), Math.abs(simulation.z[i]));
      }
      if (params.wallEnabled && Math.abs(params.wallZ) <= span * 1.25) span = Math.max(span, Math.abs(params.wallZ));
      span = niceStep(span / 3.5) * 3.5;
      const wallVisible = params.wallEnabled && params.wallZ >= -span && params.wallZ <= span;
      const projectionScale = Math.min(width - pad * 2, height - pad * 2) / 3.05;
      const yaw = -0.72;
      const pitch = 0.56;
      const cosYaw = Math.cos(yaw);
      const sinYaw = Math.sin(yaw);
      const cosPitch = Math.cos(pitch);
      const sinPitch = Math.sin(pitch);

      function project(x, y, z) {
        const nx = x / span;
        const ny = y / span;
        const nz = z / span;
        const rx = nx * cosYaw - ny * sinYaw;
        const ry = nx * sinYaw + ny * cosYaw;
        const screenY = ry * cosPitch - nz * sinPitch;
        const depth = ry * sinPitch + nz * cosPitch;
        const perspective = 1 / (1 - depth * 0.12);
        return [
          cx + rx * perspective * projectionScale,
          cy + screenY * perspective * projectionScale,
          depth,
        ];
      }

      function drawSegment(from, to, color, widthValue = 1) {
        ctx.strokeStyle = color;
        ctx.lineWidth = widthValue * scale;
        ctx.beginPath();
        ctx.moveTo(from[0], from[1]);
        ctx.lineTo(to[0], to[1]);
        ctx.stroke();
      }

      function drawArrow(from, to, color) {
        drawSegment(from, to, color, 1.45);
        ctx.fillStyle = color;
        const angle = Math.atan2(to[1] - from[1], to[0] - from[0]);
        const arrow = 9 * scale;
        ctx.beginPath();
        ctx.moveTo(to[0], to[1]);
        ctx.lineTo(to[0] - arrow * Math.cos(angle - 0.42), to[1] - arrow * Math.sin(angle - 0.42));
        ctx.lineTo(to[0] - arrow * Math.cos(angle + 0.42), to[1] - arrow * Math.sin(angle + 0.42));
        ctx.closePath();
        ctx.fill();
      }

      const gridTicks = niceTicks(-span, span, Math.max(8, Math.floor(Math.min(width, height) / (92 * scale))));
      for (const value of gridTicks) {
        drawSegment(project(-span, value, -span), project(span, value, -span), "rgba(148,163,184,0.22)", 0.8);
        drawSegment(project(value, -span, -span), project(value, span, -span), "rgba(148,163,184,0.22)", 0.8);
      }

      const cornerCoords = [
        [-span, -span, -span],
        [span, -span, -span],
        [span, span, -span],
        [-span, span, -span],
        [-span, -span, span],
        [span, -span, span],
        [span, span, span],
        [-span, span, span],
      ];
      const corners = cornerCoords.map((point) => project(...point));
      const edges = [
        [0, 1], [1, 2], [2, 3], [3, 0],
        [4, 5], [5, 6], [6, 7], [7, 4],
        [0, 4], [1, 5], [2, 6], [3, 7],
      ];
      for (const [a, b] of edges) drawSegment(corners[a], corners[b], "rgba(100,116,139,0.38)", 1);

      function drawWallPlane() {
        const wallZ = Math.max(-span, Math.min(span, params.wallZ));
        const wallCorners = [
          project(-span, -span, wallZ),
          project(span, -span, wallZ),
          project(span, span, wallZ),
          project(-span, span, wallZ),
        ];
        ctx.fillStyle = WALL_FILL;
        ctx.strokeStyle = WALL_COLOR;
        ctx.lineWidth = 1.25 * scale;
        ctx.setLineDash([7 * scale, 5 * scale]);
        ctx.beginPath();
        wallCorners.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point[0], point[1]);
          else ctx.lineTo(point[0], point[1]);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([]);

        const labelPoint = project(span, -span, wallZ);
        ctx.fillStyle = WALL_COLOR;
        ctx.font = `${12 * scale}px system-ui`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(`wall z=${formatTick(params.wallZ)} nm`, labelPoint[0] + 8 * scale, labelPoint[1] - 8 * scale);
      }

      if (wallVisible) drawWallPlane();

      function drawProjectedEllipse(axisA, axisB, color) {
        const points = [];
        for (let i = 0; i <= 128; i += 1) {
          const theta = (i / 128) * Math.PI * 2;
          const point = [0, 0, 0];
          point[axisA] = analysis.sigma[axisA] * Math.cos(theta);
          point[axisB] = analysis.sigma[axisB] * Math.sin(theta);
          points.push(project(point[0], point[1], point[2]));
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.2 * scale;
        ctx.setLineDash([5 * scale, 5 * scale]);
        ctx.beginPath();
        points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point[0], point[1]);
          else ctx.lineTo(point[0], point[1]);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      }

      drawProjectedEllipse(0, 1, "rgba(37,99,235,0.34)");
      drawProjectedEllipse(1, 2, "rgba(5,150,105,0.34)");
      drawProjectedEllipse(2, 0, "rgba(220,38,38,0.34)");

      const axes = [
        { label: "x (nm)", color: "#2563eb", point: (v) => [v, 0, 0] },
        { label: "y (nm)", color: "#059669", point: (v) => [0, v, 0] },
        { label: "z (nm)", color: "#dc2626", point: (v) => [0, 0, v] },
      ];
      const tickValues = niceTicks(-span, span, Math.max(7, Math.floor(Math.min(width, height) / (110 * scale))));
      axes.forEach(({ label, color, point }) => {
        const a = project(...point(-span));
        const b = project(...point(span));
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const length = Math.max(1, Math.hypot(dx, dy));
        const nx = -dy / length;
        const ny = dx / length;
        drawArrow(a, b, color);

        ctx.font = `${10.5 * scale}px system-ui`;
        ctx.fillStyle = "#64748b";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (const value of tickValues) {
          const p = project(...point(value));
          ctx.strokeStyle = color;
          ctx.lineWidth = 1 * scale;
          ctx.beginPath();
          ctx.moveTo(p[0] - nx * 4.5 * scale, p[1] - ny * 4.5 * scale);
          ctx.lineTo(p[0] + nx * 4.5 * scale, p[1] + ny * 4.5 * scale);
          ctx.stroke();
          if (Math.abs(value) > span * 0.06 && Math.abs(Math.abs(value) - span) > span * 0.03) {
            ctx.fillText(formatTick(value), p[0] + nx * 16 * scale, p[1] + ny * 16 * scale);
          }
        }
        ctx.fillStyle = color;
        ctx.font = `${13 * scale}px system-ui`;
        ctx.fillText(
          label,
          b[0] + (dx / length) * 14 * scale + nx * 24 * scale,
          b[1] + (dy / length) * 14 * scale + ny * 24 * scale,
        );
      });

      const stride = Math.max(1, Math.floor(params.steps / 9000));
      ctx.strokeStyle = "rgba(71,85,105,0.24)";
      ctx.lineWidth = 1.15 * scale;
      ctx.beginPath();
      for (let i = 0; i < simulation.length; i += stride) {
        const [px, py] = project(simulation.x[i], simulation.y[i], -span);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      let previous = project(simulation.x[0], simulation.y[0], simulation.z[0]);
      ctx.lineWidth = Math.max(1.25 * scale, scale);
      for (let i = stride; i < simulation.length; i += stride) {
        const next = project(simulation.x[i], simulation.y[i], simulation.z[i]);
        const t = i / Math.max(1, simulation.length - 1);
        drawSegment(previous, next, trajectoryColor(t, 0.58), 1.12);
        previous = next;
      }
      const last = simulation.length - 1;
      if ((simulation.length - 1) % stride !== 0) {
        const next = project(simulation.x[last], simulation.y[last], simulation.z[last]);
        drawSegment(previous, next, trajectoryColor(1, 0.58), 1.12);
      }

      const start = project(simulation.x[0], simulation.y[0], simulation.z[0]);
      const end = project(simulation.x[last], simulation.y[last], simulation.z[last]);
      drawDot(ctx, start[0], start[1], "#2563eb", 5.5);
      drawDot(ctx, end[0], end[1], "#dc2626", 5.5);
      drawTimeBar(ctx, width, scale);
      if (params.wallEnabled && !wallVisible) {
        drawWallNote(ctx, 20 * scale, height - 58 * scale, `wall z=${formatTick(params.wallZ)} nm outside zoom`, scale);
      }
      const legendItems = [["start", "#2563eb"], ["end", "#dc2626"]];
      if (params.wallEnabled) legendItems.push(["wall", WALL_COLOR, true]);
      drawLegend(ctx, width, height, legendItems, {
        x: Math.max(18 * scale, width - (params.wallEnabled ? 190 : 132) * scale),
        y: height - 26 * scale,
        maxWidth: (params.wallEnabled ? 174 : 116) * scale,
      });
    }

    function drawPositionDistribution(canvas, state) {
      const { simulation, params, analysis } = state;
      const { ctx, width, height, scale } = setupCanvas(canvas);
      drawFrame(ctx, width, height);
      const plane = currentDensityPlane();
      const histograms = plane.axes.map((axisIndex) => Analysis.positionHistogram(simulation, params, analysis, axisIndex));
      const yMax = niceUpperBound(Math.max(...histograms.map((hist) => hist.maxCount)), 5);
      const padL = 78 * scale;
      const padR = 42 * scale;
      const padT = 42 * scale;
      const padB = 56 * scale;
      const gap = 48 * scale;
      const plotW = Math.max(160, width - padL - padR);
      const plotH = Math.max(110, (height - padT - padB - gap) / 2);
      histograms.forEach((histogram, index) => {
        drawHistogramPanel(ctx, width, height, {
          x: padL,
          y: padT + index * (plotH + gap),
          w: plotW,
          h: plotH,
        }, histogram, state, yMax);
      });
    }

    function drawConditionalStatistic(canvas, state, mode) {
      const { ctx, width, height, scale } = setupCanvas(canvas);
      drawFrame(ctx, width, height);
      ensureConditionalMoments(state);
      const plane = currentDensityPlane();
      const histograms = plane.axes.map((axisIndex) => state.conditionalMoments[axisIndex]);
      const maxValue = mode === "drift"
        ? Math.max(...histograms.map((histogram) => histogram.driftMaxAbs))
        : Math.max(...histograms.map((histogram) => histogram.diffusionMax));
      const yMax = niceUpperBound(maxValue, 5);
      const yMin = mode === "drift" ? -yMax : 0;
      const padL = 82 * scale;
      const padR = 42 * scale;
      const padT = 42 * scale;
      const padB = 56 * scale;
      const gap = 48 * scale;
      const plotW = Math.max(160, width - padL - padR);
      const plotH = Math.max(110, (height - padT - padB - gap) / 2);
      histograms.forEach((histogram, index) => {
        drawConditionalMomentPanel(ctx, width, height, {
          x: padL,
          y: padT + index * (plotH + gap),
          w: plotW,
          h: plotH,
        }, histogram, state, {
          mode,
          yMin,
          yMax,
          yLabel: mode === "drift" ? "C(r) (nm/ms)" : "D(r) (nm²/ms)",
        });
      });
    }

    function drawDensityProjection(canvas, state, mode) {
      const { simulation, params, analysis } = state;
      const plane = currentDensityPlane();
      const [axisX, axisY] = plane.axes;
      const extent = Analysis.commonDensityExtent(simulation, params, analysis, axisX, axisY);
      const measuredDensity = Analysis.density(simulation, params, analysis, axisX, axisY, extent);
      const theoryDensity = Analysis.fokkerPlanckDensity(params, analysis, axisX, axisY, extent);
      const densityMax = Math.max(maxGridValue(measuredDensity.grid), maxGridValue(theoryDensity.grid));
      const densityData = mode === "theory" ? theoryDensity : measuredDensity;
      const sigmas = [analysis.sigma[axisX], analysis.sigma[axisY]];
      const xLabel = axisLabel(axisX);
      const yLabel = axisLabel(axisY);
      drawDensity(canvas, densityData, "magma", xLabel, yLabel, {
        maxValue: densityMax,
        sigmas,
        centers: [equilibriumCenter(axisX, params), equilibriumCenter(axisY, params)],
        axisX,
        axisY,
        params,
      });
    }

    function drawAcf(canvas, state) {
      ensureAcfSeries(state);
      drawLinePlot(canvas, state.acfData[0], {
        xLabel: "lag time (ms)",
        yLabel: "coordinate ACF",
        yZero: true,
        zeroLine: true,
        series: state.acfSeries,
      });
    }

    function drawMsd(canvas, state) {
      ensureMsdSeries(state);
      drawLinePlot(canvas, state.msdData[0], {
        xLabel: "lag time (ms)",
        yLabel: "coordinate MSD (nm²)",
        logX: true,
        logY: true,
        series: state.msdSeries,
      });
    }

    function drawDensity(canvas, densityData, palette, xLabel, yLabel, options = {}) {
      const { ctx, width, height, scale } = setupCanvas(canvas);
      drawFrame(ctx, width, height);
      const padL = 76 * scale;
      const padR = 46 * scale;
      const padT = 38 * scale;
      const padB = 58 * scale;
      const availableW = Math.max(100, width - padL - padR);
      const availableH = Math.max(100, height - padT - padB);
      const plotSize = Math.max(100, Math.floor(Math.min(availableW, availableH)));
      const plotX = Math.floor(padL + (availableW - plotSize) / 2);
      const plotY = Math.floor(padT + (availableH - plotSize) / 2);
      const bins = densityData.grid.length;
      const max = options.maxValue ?? maxGridValue(densityData.grid);
      const image = ctx.createImageData(plotSize, plotSize);
      for (let py = 0; py < plotSize; py += 1) {
        for (let px = 0; px < plotSize; px += 1) {
          const gx = Math.floor((px / plotSize) * bins);
          const gy = bins - 1 - Math.floor((py / plotSize) * bins);
          const v = max > 0 ? densityData.grid[gy][gx] / max : 0;
          const [r, g, b] = colorRamp(Math.sqrt(v), palette);
          const offset = (py * plotSize + px) * 4;
          image.data[offset] = r;
          image.data[offset + 1] = g;
          image.data[offset + 2] = b;
          image.data[offset + 3] = 255;
        }
      }
      ctx.putImageData(image, plotX, plotY);
      drawAxes(ctx, width, height, plotX, plotY, plotSize, plotSize, xLabel, yLabel, {
        xMin: -densityData.spanX,
        xMax: densityData.spanX,
        yMin: -densityData.spanY,
        yMax: densityData.spanY,
        xTickCount: Math.max(8, Math.floor(plotSize / (76 * scale))),
        yTickCount: Math.max(8, Math.floor(plotSize / (76 * scale))),
      });

      const zeroX = plotX + plotSize / 2;
      const zeroY = plotY + plotSize / 2;
      ctx.strokeStyle = "rgba(255,255,255,0.72)";
      ctx.lineWidth = 1 * scale;
      ctx.beginPath();
      ctx.moveTo(zeroX, plotY);
      ctx.lineTo(zeroX, plotY + plotSize);
      ctx.moveTo(plotX, zeroY);
      ctx.lineTo(plotX + plotSize, zeroY);
      ctx.stroke();
      if (options.sigmas) drawStdEllipses(ctx, plotX, plotY, plotSize, plotSize, densityData, options.sigmas, options.centers);
      drawDensityWallMarker(ctx, plotX, plotY, plotSize, plotSize, densityData, options);
    }

    function drawDensityWallMarker(ctx, x, y, w, h, densityData, options) {
      const scale = window.devicePixelRatio || 1;
      const { axisX, axisY, params } = options;
      if (!params?.wallEnabled) return;
      if (!params || (axisX !== 2 && axisY !== 2)) {
        if (params) drawWallNote(ctx, x + 10 * scale, y + 16 * scale, `wall z=${formatTick(params.wallZ)} nm`, scale);
        return;
      }

      ctx.save();
      ctx.fillStyle = WALL_FILL;
      ctx.strokeStyle = WALL_COLOR;
      ctx.lineWidth = 1.45 * scale;
      ctx.setLineDash([7 * scale, 5 * scale]);
      ctx.font = `${11 * scale}px system-ui`;
      ctx.fillStyle = WALL_COLOR;
      ctx.textBaseline = "middle";

      if (axisX === 2) {
        const wallX = x + ((params.wallZ + densityData.spanX) / (2 * densityData.spanX)) * w;
        const clippedX = Math.max(x, Math.min(x + w, wallX));
        ctx.fillStyle = WALL_FILL;
        ctx.fillRect(x, y, Math.max(0, clippedX - x), h);
        if (wallX >= x && wallX <= x + w) {
          ctx.strokeStyle = WALL_COLOR;
          ctx.beginPath();
          ctx.moveTo(wallX, y);
          ctx.lineTo(wallX, y + h);
          ctx.stroke();
          ctx.fillStyle = WALL_COLOR;
          ctx.textAlign = wallX < x + w * 0.65 ? "left" : "right";
          ctx.fillText(`wall z=${formatTick(params.wallZ)} nm`, wallX + (wallX < x + w * 0.65 ? 7 : -7) * scale, y + 17 * scale);
        }
      }

      if (axisY === 2) {
        const wallY = y + h - ((params.wallZ + densityData.spanY) / (2 * densityData.spanY)) * h;
        const clippedY = Math.max(y, Math.min(y + h, wallY));
        ctx.fillStyle = WALL_FILL;
        ctx.fillRect(x, clippedY, w, Math.max(0, y + h - clippedY));
        if (wallY >= y && wallY <= y + h) {
          ctx.strokeStyle = WALL_COLOR;
          ctx.beginPath();
          ctx.moveTo(x, wallY);
          ctx.lineTo(x + w, wallY);
          ctx.stroke();
          ctx.fillStyle = WALL_COLOR;
          ctx.textAlign = "right";
          ctx.fillText(`wall z=${formatTick(params.wallZ)} nm`, x + w - 8 * scale, wallY - 11 * scale);
        }
      }

      ctx.restore();
    }

    function drawWallNote(ctx, x, y, label, scale) {
      ctx.save();
      ctx.strokeStyle = WALL_COLOR;
      ctx.fillStyle = WALL_COLOR;
      ctx.lineWidth = 1.4 * scale;
      ctx.setLineDash([6 * scale, 4 * scale]);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 22 * scale, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = `${11 * scale}px system-ui`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x + 28 * scale, y);
      ctx.restore();
    }

    function drawStdEllipses(ctx, x, y, w, h, densityData, sigmas, centers = [0, 0]) {
      const scale = window.devicePixelRatio || 1;
      const [sigmaX, sigmaY] = sigmas;
      const [centerDataX, centerDataY] = centers;
      const centerX = x + ((centerDataX + densityData.spanX) / (2 * densityData.spanX)) * w;
      const centerY = y + h - ((centerDataY + densityData.spanY) / (2 * densityData.spanY)) * h;
      const levels = [
        [3, "rgba(255,255,255,0.54)"],
        [2, "rgba(255,255,255,0.72)"],
        [1, "rgba(255,255,255,0.92)"],
      ];
      ctx.save();
      ctx.font = `${10.5 * scale}px system-ui`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      for (const [level, color] of levels) {
        const rx = (level * sigmaX / densityData.spanX) * (w / 2);
        const ry = (level * sigmaY / densityData.spanY) * (h / 2);
        if (!Number.isFinite(rx) || !Number.isFinite(ry) || rx <= 0 || ry <= 0) continue;
        ctx.strokeStyle = color;
        ctx.lineWidth = (level === 1 ? 1.35 : 1.05) * scale;
        ctx.setLineDash(level === 1 ? [] : [5 * scale, 4 * scale]);
        ctx.beginPath();
        ctx.ellipse(centerX, centerY, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        const labelX = Math.min(x + w - 24 * scale, centerX + rx + 6 * scale);
        const labelY = Math.max(y + 12 * scale, Math.min(y + h - 12 * scale, centerY - ry));
        ctx.fillStyle = color;
        ctx.fillText(`${level}σ`, labelX, labelY);
      }
      ctx.restore();
    }

    function drawHistogramPanel(ctx, width, height, box, histogram, state, yMax) {
      const scale = window.devicePixelRatio || 1;
      const axis = axisMeta[histogram.axisIndex];
      const { x, y, w, h } = box;
      const xMin = -histogram.span;
      const xMax = histogram.span;
      const maxCount = Math.max(1, yMax);
      const mapX = (value) => x + ((value - xMin) / Math.max(xMax - xMin, 1e-12)) * w;
      const mapY = (value) => y + h - (value / maxCount) * h;

      drawAxes(ctx, width, height, x, y, w, h, `${axis.label} position (nm)`, "steps / bin", {
        ranges: { xMin, xMax, yMin: 0, yMax: maxCount },
        xTickCount: Math.max(7, Math.floor(w / (90 * scale))),
        yTickCount: Math.max(5, Math.floor(h / (64 * scale))),
      });

      if (state.params.wallEnabled && histogram.axisIndex === 2) drawHistogramWallRegion(ctx, x, y, w, h, xMin, xMax, state.params.wallZ, mapX);

      const barW = w / histogram.counts.length;
      ctx.fillStyle = hexToRgba(axis.color, 0.58);
      for (let i = 0; i < histogram.counts.length; i += 1) {
        const count = histogram.counts[i];
        const barX = x + i * barW;
        const barY = mapY(count);
        ctx.fillRect(
          barX,
          barY,
          Math.max(1 * scale, barW - 0.25 * scale),
          Math.max(0, y + h - barY),
        );
      }

      const mean = state.analysis.mean[histogram.axisIndex];
      if (mean >= xMin && mean <= xMax) {
        const meanX = mapX(mean);
        ctx.strokeStyle = "rgba(15,23,42,0.48)";
        ctx.lineWidth = 1 * scale;
        ctx.setLineDash([4 * scale, 4 * scale]);
        ctx.beginPath();
        ctx.moveTo(meanX, y);
        ctx.lineTo(meanX, y + h);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      const sigma = state.analysis.sigma[histogram.axisIndex];
      if (Number.isFinite(sigma) && sigma > 0) {
        ctx.strokeStyle = axis.color;
        ctx.lineWidth = 1.45 * scale;
        ctx.setLineDash([7 * scale, 5 * scale]);
        ctx.beginPath();
        for (let i = 0; i <= 360; i += 1) {
          const xValue = xMin + (i / 360) * (xMax - xMin);
          const density = equilibriumDensity1D(xValue, histogram.axisIndex, sigma, state.params);
          const expectedCount = histogram.total * histogram.binWidth * density;
          const px = mapX(xValue);
          const py = mapY(Math.min(expectedCount, maxCount));
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (state.params.wallEnabled && histogram.axisIndex === 2) drawHistogramWallLine(ctx, x, y, w, h, xMin, xMax, state.params.wallZ, mapX);

      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 1 * scale;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#475569";
      ctx.font = `${11 * scale}px system-ui`;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(`bin ${formatTick(histogram.binWidth)} nm`, x + w - 8 * scale, y + 15 * scale);
      const kappaEstimate = state.analysis.kappaFromVariance[histogram.axisIndex];
      if (Number.isFinite(kappaEstimate)) {
        ctx.fillText(`κ_var=${formatKappaEstimate(kappaEstimate)}`, x + w - 8 * scale, y + 32 * scale);
      }
      drawLegend(ctx, width, height, [
        [`${axis.label} count`, axis.color],
        [`${axis.label} theory`, axis.color, true],
      ], {
        x: x + 9 * scale,
        y: y + 16 * scale,
        maxWidth: Math.max(120 * scale, w - 18 * scale),
        fontSize: 10.5,
        rowHeight: 15,
      });
    }

    function drawConditionalMomentPanel(ctx, width, height, box, histogram, state, options) {
      const scale = window.devicePixelRatio || 1;
      const axis = axisMeta[histogram.axisIndex];
      const { x, y, w, h } = box;
      const xMin = -histogram.span;
      const xMax = histogram.span;
      const yMin = options.yMin;
      const yMax = options.yMax;
      const values = options.mode === "drift" ? histogram.driftValues : histogram.diffusionValues;
      const theoryValues = options.mode === "drift" ? histogram.driftTheory : histogram.diffusionTheory;
      const label = options.mode === "drift" ? "C(r)" : "D(r)";
      const mapX = (value) => x + ((value - xMin) / Math.max(xMax - xMin, 1e-12)) * w;
      const mapY = (value) => y + h - ((value - yMin) / Math.max(yMax - yMin, 1e-12)) * h;

      drawAxes(ctx, width, height, x, y, w, h, `${axis.label} position (nm)`, options.yLabel, {
        ranges: { xMin, xMax, yMin, yMax },
        xTickCount: Math.max(7, Math.floor(w / (90 * scale))),
        yTickCount: Math.max(5, Math.floor(h / (64 * scale))),
      });

      if (state.params.wallEnabled && histogram.axisIndex === 2) drawHistogramWallRegion(ctx, x, y, w, h, xMin, xMax, state.params.wallZ, mapX);

      if (yMin < 0 && yMax > 0) {
        const zeroY = mapY(0);
        ctx.strokeStyle = "rgba(15,23,42,0.42)";
        ctx.lineWidth = 1 * scale;
        ctx.beginPath();
        ctx.moveTo(x, zeroY);
        ctx.lineTo(x + w, zeroY);
        ctx.stroke();
      }

      const measuredPoints = [];
      const theoryPoints = [];
      for (let i = 0; i < values.length; i += 1) {
        const position = histogram.positions ? histogram.positions[i] : xMin + (i + 0.5) * histogram.binWidth;
        measuredPoints.push([
          position,
          histogram.counts[i] > 0 && Number.isFinite(values[i]) ? values[i] : NaN,
        ]);
        theoryPoints.push([
          position,
          Number.isFinite(theoryValues[i]) ? theoryValues[i] : NaN,
        ]);
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      drawPlotLine(ctx, theoryPoints, mapX, mapY, {
        color: axis.color,
        dash: true,
        width: 1.45,
      });
      drawPlotLine(ctx, measuredPoints, mapX, mapY, {
        color: axis.color,
        width: 1.9,
        shadow: hexToRgba(axis.color, 0.14),
      });
      ctx.restore();

      if (state.params.wallEnabled && histogram.axisIndex === 2) drawHistogramWallLine(ctx, x, y, w, h, xMin, xMax, state.params.wallZ, mapX);

      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 1 * scale;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#475569";
      ctx.font = `${11 * scale}px system-ui`;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(`bin ${formatTick(histogram.binWidth)} nm`, x + w - 8 * scale, y + 15 * scale);
      drawLegend(ctx, width, height, [
        [`${axis.label} ${label} sim`, axis.color],
        [`${axis.label} ${label} th`, axis.color, true],
      ], {
        x: x + 9 * scale,
        y: y + 16 * scale,
        maxWidth: Math.max(120 * scale, w - 18 * scale),
        fontSize: 10.5,
        rowHeight: 15,
      });
    }

    function drawHistogramWallRegion(ctx, x, y, w, h, xMin, xMax, wallZ, mapX) {
      if (wallZ <= xMin) return;
      const scale = window.devicePixelRatio || 1;
      const wallX = Math.min(x + w, mapX(Math.min(wallZ, xMax)));
      ctx.save();
      ctx.fillStyle = WALL_FILL;
      ctx.fillRect(x, y, Math.max(0, wallX - x), h);
      ctx.restore();
    }

    function drawHistogramWallLine(ctx, x, y, w, h, xMin, xMax, wallZ, mapX) {
      if (wallZ < xMin || wallZ > xMax) return;
      const scale = window.devicePixelRatio || 1;
      const wallX = mapX(wallZ);
      ctx.save();
      ctx.strokeStyle = WALL_COLOR;
      ctx.fillStyle = WALL_COLOR;
      ctx.lineWidth = 1.5 * scale;
      ctx.setLineDash([7 * scale, 5 * scale]);
      ctx.beginPath();
      ctx.moveTo(wallX, y);
      ctx.lineTo(wallX, y + h);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = `${11 * scale}px system-ui`;
      ctx.textAlign = wallX < x + w * 0.65 ? "left" : "right";
      ctx.textBaseline = "middle";
      ctx.fillText(`wall z=${formatTick(wallZ)} nm`, wallX + (wallX < x + w * 0.65 ? 7 : -7) * scale, y + 34 * scale);
      ctx.restore();
    }

    function drawTimeBar(ctx, width, scale) {
      const barW = Math.min(150 * scale, width * 0.24);
      const barH = 7 * scale;
      const x = width - barW - 20 * scale;
      const y = 22 * scale;
      const gradient = ctx.createLinearGradient(x, 0, x + barW, 0);
      gradient.addColorStop(0, trajectoryColor(0));
      gradient.addColorStop(0.5, trajectoryColor(0.5));
      gradient.addColorStop(1, trajectoryColor(1));
      ctx.fillStyle = gradient;
      ctx.fillRect(x, y, barW, barH);
      ctx.strokeStyle = "rgba(71,85,105,0.55)";
      ctx.lineWidth = 1 * scale;
      ctx.strokeRect(x, y, barW, barH);
      ctx.fillStyle = "#475569";
      ctx.font = `${10.5 * scale}px system-ui`;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText("time", x + barW / 2, y + 11 * scale);
    }

    function drawPlotLine(ctx, points, mapX, mapY, options = {}) {
      const scale = window.devicePixelRatio || 1;
      ctx.save();
      ctx.strokeStyle = options.color || "#334155";
      ctx.lineWidth = (options.width || 1.6) * scale;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.setLineDash(options.dash ? [7 * scale, 5 * scale] : []);
      if (options.shadow) {
        ctx.shadowColor = options.shadow;
        ctx.shadowBlur = 4 * scale;
      }
      ctx.beginPath();
      let started = false;
      for (const [xValue, yValue] of points) {
        if (!Number.isFinite(xValue) || !Number.isFinite(yValue)) {
          started = false;
          continue;
        }
        const xPoint = mapX(xValue);
        const yPoint = mapY(yValue);
        if (!started) {
          ctx.moveTo(xPoint, yPoint);
          started = true;
        } else {
          ctx.lineTo(xPoint, yPoint);
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawLinePlot(canvas, data, options) {
      const { ctx, width, height, scale } = setupCanvas(canvas);
      drawFrame(ctx, width, height);
      const padL = 76 * scale;
      const padR = 44 * scale;
      const padT = 54 * scale;
      const padB = 60 * scale;
      const w = Math.max(140, width - padL - padR);
      const h = Math.max(110, height - padT - padB);
      const series = options.series ?? [{ data, color: options.color || "#334155", label: options.label || "simulation" }];
      const allPoints = series.flatMap((item) => item.data).filter(([x, y]) => {
        if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
        if (options.logX && x <= 0) return false;
        if (options.logY && y <= 0) return false;
        return true;
      });
      if (!allPoints.length) return;

      let rawMinX = Math.min(...allPoints.map((d) => d[0]));
      let rawMaxX = Math.max(...allPoints.map((d) => d[0]));
      let rawMinY = Math.min(...allPoints.map((d) => d[1]));
      let rawMaxY = Math.max(...allPoints.map((d) => d[1]));
      if (options.yZero && !options.logY) {
        rawMinY = Math.min(rawMinY, 0);
        rawMaxY = Math.max(rawMaxY, 0);
      }
      if (!options.logY) {
        const pad = Math.max((rawMaxY - rawMinY) * 0.08, 0.04);
        rawMinY -= pad;
        rawMaxY += pad;
      }
      if (rawMinX === rawMaxX) {
        rawMinX -= 1;
        rawMaxX += 1;
      }
      if (rawMinY === rawMaxY) {
        rawMinY *= 0.8;
        rawMaxY *= 1.2;
      }

      const transformX = (value) => options.logX ? Math.log10(Math.max(value, 1e-12)) : value;
      const transformY = (value) => options.logY ? Math.log10(Math.max(value, 1e-12)) : value;
      const minX = transformX(rawMinX);
      const maxX = transformX(rawMaxX);
      const minY = transformY(rawMinY);
      const maxY = transformY(rawMaxY);
      const px = (x) => padL + ((x - minX) / Math.max(maxX - minX, 1e-12)) * w;
      const py = (y) => padT + h - ((y - minY) / Math.max(maxY - minY, 1e-12)) * h;

      drawAxes(ctx, width, height, padL, padT, w, h, options.xLabel, options.yLabel, {
