        ranges: { xMin: rawMinX, xMax: rawMaxX, yMin: rawMinY, yMax: rawMaxY },
        xLog: options.logX,
        yLog: options.logY,
        xTickCount: Math.max(7, Math.floor(w / (90 * scale))),
        yTickCount: Math.max(7, Math.floor(h / (70 * scale))),
      });

      if (options.zeroLine && minY <= 0 && maxY >= 0) {
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 1 * scale;
        ctx.beginPath();
        ctx.moveTo(padL, py(0));
        ctx.lineTo(padL + w, py(0));
        ctx.stroke();
      }

      for (const item of series) {
        ctx.strokeStyle = item.color || "#334155";
        ctx.lineWidth = (item.width || 1.6) * scale;
        ctx.setLineDash(item.dash ? [7 * scale, 5 * scale] : []);
        ctx.beginPath();
        let started = false;
        item.data.forEach(([xValue, yValue]) => {
          if (!Number.isFinite(xValue) || !Number.isFinite(yValue)) return;
          if ((options.logX && xValue <= 0) || (options.logY && yValue <= 0)) return;
          const xPoint = px(transformX(xValue));
          const yPoint = py(transformY(yValue));
          if (!started) {
            ctx.moveTo(xPoint, yPoint);
            started = true;
          } else {
            ctx.lineTo(xPoint, yPoint);
          }
        });
        ctx.stroke();
        ctx.setLineDash([]);
      }

      drawLegend(ctx, width, height, series.map((item) => [item.label, item.color || "#334155", item.dash]), {
        x: padL + 10 * scale,
        y: padT - 22 * scale,
        maxWidth: Math.max(90 * scale, w - 20 * scale),
        fontSize: 10.5,
        rowHeight: 16,
      });
    }

    function drawAxes(ctx, width, height, x, y, w, h, xLabel, yLabel, options = null) {
      const scale = window.devicePixelRatio || 1;
      const ranges = options && Object.prototype.hasOwnProperty.call(options, "xMin") ? options : options?.ranges;
      const xLog = Boolean(options?.xLog);
      const yLog = Boolean(options?.yLog);

      if (ranges) {
        const tx = (value) => xLog ? Math.log10(Math.max(value, 1e-12)) : value;
        const ty = (value) => yLog ? Math.log10(Math.max(value, 1e-12)) : value;
        const x0 = tx(ranges.xMin);
        const x1 = tx(ranges.xMax);
        const y0 = ty(ranges.yMin);
        const y1 = ty(ranges.yMax);
        const mapX = (value) => x + ((tx(value) - x0) / Math.max(x1 - x0, 1e-12)) * w;
        const mapY = (value) => y + h - ((ty(value) - y0) / Math.max(y1 - y0, 1e-12)) * h;
        const xTickCount = options?.xTickCount ?? Math.max(6, Math.floor(w / (92 * scale)));
        const yTickCount = options?.yTickCount ?? Math.max(6, Math.floor(h / (74 * scale)));
        const xTicks = axisTicks(ranges.xMin, ranges.xMax, xLog, xTickCount);
        const yTicks = axisTicks(ranges.yMin, ranges.yMax, yLog, yTickCount);

        ctx.strokeStyle = "#e5e7eb";
        ctx.lineWidth = 1 * scale;
        for (const tick of xTicks) {
          const px = mapX(tick);
          ctx.beginPath();
          ctx.moveTo(px, y);
          ctx.lineTo(px, y + h);
          ctx.stroke();
        }
        for (const tick of yTicks) {
          const py = mapY(tick);
          ctx.beginPath();
          ctx.moveTo(x, py);
          ctx.lineTo(x + w, py);
          ctx.stroke();
        }

        ctx.strokeStyle = "#64748b";
        ctx.fillStyle = "#475569";
        ctx.font = `${10.5 * scale}px system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        for (const tick of xTicks) {
          const px = mapX(tick);
          ctx.beginPath();
          ctx.moveTo(px, y + h);
          ctx.lineTo(px, y + h + 5 * scale);
          ctx.stroke();
          ctx.fillText(formatTick(tick), px, y + h + 8 * scale);
        }

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        for (const tick of yTicks) {
          const py = mapY(tick);
          ctx.beginPath();
          ctx.moveTo(x - 5 * scale, py);
          ctx.lineTo(x, py);
          ctx.stroke();
          ctx.fillText(formatTick(tick), x - 7 * scale, py);
        }
      }

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1 * scale;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#475569";
      ctx.font = `${12.5 * scale}px system-ui`;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(xLabel, x + w / 2, Math.min(height - 12 * scale, y + h + 36 * scale));
      ctx.save();
      ctx.translate(19 * scale, y + h / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(yLabel, 0, 0);
      ctx.restore();
    }

    function drawDot(ctx, x, y, color, radius = 5) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, radius * (window.devicePixelRatio || 1), 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLegend(ctx, width, height, items, options = {}) {
      const scale = window.devicePixelRatio || 1;
      ctx.font = `${(options.fontSize || 11) * scale}px system-ui`;
      ctx.textBaseline = "middle";
      const maxWidth = options.maxWidth ?? width - 28 * scale;
      let x = options.x ?? 14 * scale;
      let y = options.y ?? (height - 22 * scale);
      const startX = x;
      const rowHeight = (options.rowHeight || 18) * scale;
      for (const [label, color, dash = false] of items) {
        const itemWidth = 30 * scale + ctx.measureText(label).width;
        if (x > startX && x + itemWidth > startX + maxWidth) {
          x = startX;
          y += rowHeight;
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 2 * scale;
        ctx.setLineDash(dash ? [5 * scale, 4 * scale] : []);
        ctx.beginPath();
        ctx.moveTo(x - 2 * scale, y);
        ctx.lineTo(x + 13 * scale, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x + 5 * scale, y, 3 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#475569";
        ctx.fillText(label, x + 18 * scale, y);
        x += itemWidth + 10 * scale;
      }
    }

    function colorRamp(t, palette) {
      t = Math.max(0, Math.min(1, t));
      const stops = palette === "magma"
        ? [[22, 20, 46], [98, 26, 88], [184, 53, 88], [246, 151, 84], [252, 244, 168]]
        : [[15, 42, 67], [23, 88, 111], [40, 133, 106], [107, 179, 85], [239, 230, 101]];
      const p = t * (stops.length - 1);
      const i = Math.min(stops.length - 2, Math.floor(p));
      const f = p - i;
      const a = stops[i];
      const b = stops[i + 1];
      return [
        Math.round(a[0] + (b[0] - a[0]) * f),
        Math.round(a[1] + (b[1] - a[1]) * f),
        Math.round(a[2] + (b[2] - a[2]) * f),
      ];
    }

    function trajectoryColor(t, alpha = 1) {
      t = Math.max(0, Math.min(1, t));
      const stops = [[37, 99, 235], [20, 184, 166], [225, 29, 72]];
      const p = t * (stops.length - 1);
      const i = Math.min(stops.length - 2, Math.floor(p));
      const f = p - i;
      const a = stops[i];
      const b = stops[i + 1];
      const r = Math.round(a[0] + (b[0] - a[0]) * f);
      const g = Math.round(a[1] + (b[1] - a[1]) * f);
      const blue = Math.round(a[2] + (b[2] - a[2]) * f);
      if (alpha >= 1) return `rgb(${r}, ${g}, ${blue})`;
      return `rgba(${r}, ${g}, ${blue}, ${alpha})`;
    }

    function hexToRgba(hex, alpha) {
      const clean = hex.replace("#", "");
      const value = Number.parseInt(clean, 16);
      const r = (value >> 16) & 255;
      const g = (value >> 8) & 255;
      const b = value & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function maxGridValue(grid) {
      let max = 0;
      for (const row of grid) {
        for (const value of row) max = Math.max(max, value);
      }
      return max;
    }

    function formatTick(value) {
      if (Math.abs(value) < 1e-12) return "0";
      if (Math.abs(value) >= 1000 || Math.abs(value) < 0.01) return value.toExponential(1);
      if (Math.abs(value) >= 100) return value.toFixed(0);
      if (Math.abs(value) >= 10) return value.toFixed(1);
      return value.toPrecision(2);
    }

    function formatFactor(value) {
      return Math.abs(value) < 0.0001 ? value.toExponential(1) : value.toFixed(4);
    }

    function formatKappaEstimate(value) {
      if (value === null) return "skipped (wall)";
      if (!Number.isFinite(value)) return "n/a";
      const formatted = Math.abs(value) >= 1000 || Math.abs(value) < 0.001
        ? value.toExponential(2)
        : Number(value.toPrecision(4)).toString();
      return `${formatted} fN/nm`;
    }

    function niceStep(rawStep) {
      const power = 10 ** Math.floor(Math.log10(Math.max(rawStep, 1e-12)));
      const fraction = rawStep / power;
      if (fraction <= 1) return power;
      if (fraction <= 2) return 2 * power;
      if (fraction <= 5) return 5 * power;
      return 10 * power;
    }

    function niceUpperBound(value, count = 5) {
      const step = niceStep(Math.max(value, 1) / Math.max(1, count));
      return Math.max(step, Math.ceil(value / step) * step);
    }

    function niceTicks(min, max, count = 6) {
      if (!Number.isFinite(min) || !Number.isFinite(max)) return [];
      if (min === max) {
        const span = Math.max(Math.abs(min), 1);
        min -= span * 0.5;
        max += span * 0.5;
      }
      const step = niceStep((max - min) / Math.max(1, count));
      const start = Math.ceil(min / step) * step;
      const ticks = [];
      for (let value = start; value <= max + step * 0.5; value += step) {
        if (value >= min - step * 0.5) ticks.push(Math.abs(value) < step * 1e-9 ? 0 : value);
      }
      return ticks;
    }

    function logTicks(min, max) {
      const ticks = [];
      const start = Math.floor(Math.log10(Math.max(min, 1e-12)));
      const end = Math.ceil(Math.log10(Math.max(max, min * 1.01)));
      for (let power = start; power <= end; power += 1) {
        for (const multiplier of [1, 2, 5]) {
          const value = multiplier * 10 ** power;
          if (value >= min * 0.999 && value <= max * 1.001) ticks.push(value);
        }
      }
      return ticks.length > 14 ? ticks.filter((value) => {
        const log = Math.log10(value);
        return Math.abs(log - Math.round(log)) < 1e-9;
      }) : ticks;
    }

    function axisTicks(min, max, isLog, count = 6) {
      if (isLog) return logTicks(Math.max(min, 1e-12), Math.max(max, 1e-12));
      return niceTicks(min, max, count);
    }

    function currentDensityPlane() {
      return densityPlanes[densityPlaneIndex];
    }

    function togglePrefixForView(viewKey = activeViewKey) {
      return viewKey === "measuredDensity" || viewKey === "theoryDensity" || viewKey === "trajectory" ? "平面" : "轴";
    }

    function axisLabel(axisIndex) {
      return `${axisMeta[axisIndex].label} (nm)`;
    }

    function ensureConditionalMoments(state) {
      if (state.conditionalMoments) return;
      const t0 = performance.now();
      state.conditionalMoments = Analysis.conditionalMomentHistograms(state.simulation, state.params, state.analysis);
      statusEl.textContent = `C/D 折线已计算，用时 ${(performance.now() - t0).toFixed(0)} ms；ensemble ${state.params.ensembleSamples.toLocaleString()} / bin。`;
    }

    function ensureAcfSeries(state) {
      if (state.acfData && state.acfSeries) return;
      const t0 = performance.now();
      state.acfData = Analysis.acfByAxis(state.simulation, state.params, state.analysis);
      const acfTheory = Analysis.theoryAcfByAxis(state.acfData, state.params);
      state.acfSeries = axisMeta.flatMap((axis, index) => [
        { label: `${axis.label} sim`, data: state.acfData[index], color: axis.color, width: 1.45 },
        { label: `${axis.label} th`, data: acfTheory[index], color: axis.color, dash: true, width: 1.35 },
      ]);
      statusEl.textContent = `ACF 已计算，用时 ${(performance.now() - t0).toFixed(0)} ms。`;
    }

    function ensureMsdSeries(state) {
      if (state.msdData && state.msdSeries) return;
      const t0 = performance.now();
      state.msdData = Analysis.msdByAxis(state.simulation, state.params, state.analysis);
      const msdTheory = Analysis.theoryMsdByAxis(state.msdData, state.params, state.analysis);
      state.msdSeries = axisMeta.flatMap((axis, index) => [
        { label: `${axis.label} sim`, data: state.msdData[index], color: axis.color, width: 1.45 },
        { label: `${axis.label} th`, data: msdTheory[index], color: axis.color, dash: true, width: 1.35 },
      ]);
      statusEl.textContent = `MSD 已计算，用时 ${(performance.now() - t0).toFixed(0)} ms。`;
    }

    function render() {
      const params = paramsFromControls();
      statusEl.textContent = `运行中... T=${params.effectiveTime.toPrecision(5)} ms, steps=${params.steps.toLocaleString()}, wall ${params.wallEnabled ? "on" : "off"}, force ${params.forceEnabled ? "on" : "off"}`;
      window.requestAnimationFrame(() => {
        const t0 = performance.now();
        const simulation = Simulation.run(params);
        const analysis = Analysis.analyze(simulation, params);
        simulationState = {
          simulation,
          params,
          analysis,
          conditionalMoments: null,
          acfData: null,
          msdData: null,
          acfSeries: null,
          msdSeries: null,
        };
        Presentation.renderCurrentView();
        updateSummary(simulation, params, analysis);
        statusEl.textContent = `完成基础轨迹，用时 ${(performance.now() - t0).toFixed(0)} ms。统计曲线会在切换到对应视图时计算；wall ${params.wallEnabled ? `on: z≥${formatTick(params.wallZ)} nm` : "off"}；force ${params.forceEnabled ? "on" : "off"}。`;
      });
    }

    function updateSummary(simulation, params, analysis) {
      const last = simulation.length - 1;
      const finalGap = Math.max(0, simulation.z[last] - params.wallZ);
      const localD = localDiffusionAtZ(simulation.z[last], params);
      const energy = 0.5 * (
        params.kappa[0] * simulation.x[last] ** 2 +
        params.kappa[1] * simulation.y[last] ** 2 +
        params.kappa[2] * simulation.z[last] ** 2
      );
      const rows = [
        ["total time T", `${params.effectiveTime.toPrecision(5)} ms`],
        ["derived steps", params.steps.toLocaleString()],
        ["intermediate arrays", "t, x(t), y(t), z(t)"],
        ["C/D ensemble", `${params.ensembleSamples.toLocaleString()} next steps / bin`],
        ["γ0", `${params.gamma0.toPrecision(5)} fN ms/nm`],
        ["D0", `${params.diffusion0.toPrecision(5)} nm²/ms`],
        ["wall", params.wallEnabled ? `${formatTick(params.wallZ)} nm / α ${params.alpha.toFixed(2)}` : "off"],
        ["force", params.forceEnabled ? `${params.force.map((v) => `${v.toFixed(2)}`).join(", ")} fN` : "off"],
      ];
      if (params.wallEnabled) {
        rows.push(
          ["final wall gap", `${finalGap.toFixed(3)} nm`],
          ["hydro h", `${localD.h.toFixed(3)} nm`],
          ["final D∥ / D⊥", `${localD.parallel.toPrecision(5)}, ${localD.perpendicular.toPrecision(5)} nm²/ms`],
          ["final γ∥ / γ⊥", `${localD.gammaParallel.toPrecision(5)}, ${localD.gammaPerpendicular.toPrecision(5)} fN ms/nm`],
          ["final D factors ∥/⊥", `${formatFactor(localD.parallelFactor)}, ${formatFactor(localD.perpendicularFactor)}`],
          ["min z / wall", `${analysis.min[2].toFixed(3)} / ${formatTick(params.wallZ)} nm`],
        );
      }
      rows.push(
        ["final position", `${simulation.x[last].toFixed(3)}, ${simulation.y[last].toFixed(3)}, ${simulation.z[last].toFixed(3)} nm`],
        ["final potential", `${energy.toPrecision(5)} fN nm`],
        ["measured mean", `${analysis.mean.map((v) => v.toFixed(3)).join(", ")} nm`],
        ["theory mean", `${analysis.theoryMean.map((v) => v.toFixed(3)).join(", ")} nm`],
        ["measured std", `${analysis.std.map((v) => v.toFixed(3)).join(", ")} nm`],
        ["theory std", `${analysis.theoryStd.map((v) => v.toFixed(3)).join(", ")} nm`],
        ["kappa x from var", formatKappaEstimate(analysis.kappaFromVariance[0])],
        ["kappa y from var", formatKappaEstimate(analysis.kappaFromVariance[1])],
        ["kappa z from var", formatKappaEstimate(analysis.kappaFromVariance[2])],
      );
      summaryEl.innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`).join("");
    }

    function downloadCurrentImage() {
      const link = document.createElement("a");
      link.download = `langevin_${activeViewKey}_${currentDensityPlane().key}.png`;
      link.href = mainCanvas.toDataURL("image/png");
      link.click();
    }

    createControls();
    createViewTabs();
    document.getElementById("run").addEventListener("click", render);
    planeToggleEl.addEventListener("click", () => {
      densityPlaneIndex = (densityPlaneIndex + 1) % densityPlanes.length;
      const prefix = togglePrefixForView();
      planeToggleEl.textContent = `${prefix} ${currentDensityPlane().label}`;
      Presentation.renderCurrentView();
      statusEl.textContent = `已切换到 ${currentDensityPlane().label} ${prefix === "平面" ? "平面" : "轴组"}；未重新模拟。`;
    });
    downloadEl.addEventListener("click", downloadCurrentImage);
    window.addEventListener("resize", () => window.requestAnimationFrame(() => Presentation.renderCurrentView()));
    render();
  </script>
</body>
</html>
