<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Langevin Trap Simulation</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d8dde6;
      --text: #1f2937;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --warm: #b45309;
      --danger: #dc2626;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(270px, 330px) 1fr;
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 22px 18px;
      overflow: auto;
      max-height: 100vh;
    }

    main {
      padding: 18px;
      min-width: 0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .subtle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .control {
      display: grid;
      grid-template-columns: 1fr 82px;
      gap: 8px 10px;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #eef1f5;
    }

    .control label {
      font-size: 13px;
      color: #334155;
    }

    .control input[type="number"] {
      width: 82px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 7px;
      color: var(--text);
      background: #fff;
    }

    .control input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--accent);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 8px;
      margin: 16px 0 12px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 10px 12px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
    }

    button:hover {
      background: var(--accent-strong);
    }

    .icon-button {
      display: grid;
      place-items: center;
      background: #ffffff;
      border-color: var(--line);
      color: #334155;
      padding: 0;
    }

    .icon-button:hover {
      background: #f8fafc;
    }

    .status {
      min-height: 40px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #475569;
      background: #fbfcfe;
      font-size: 13px;
      line-height: 1.35;
    }

    .summary {
      display: grid;
      gap: 7px;
      margin-top: 12px;
      font-size: 13px;
      color: #334155;
    }

    .summary div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #eef1f5;
      padding-bottom: 7px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 1.15fr) minmax(260px, 1fr) minmax(260px, 1fr);
      grid-template-rows: minmax(310px, 52vh) minmax(250px, 34vh);
      gap: 12px;
      min-height: calc(100vh - 36px);
    }

    .plot {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .plot.wide {
      grid-row: 1 / span 2;
    }

    .plot-title {
      position: absolute;
      left: 12px;
      top: 10px;
      z-index: 2;
      color: #111827;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(216, 221, 230, 0.78);
      border-radius: 6px;
      padding: 4px 7px;
      pointer-events: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 1020px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .controls {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }

      .actions,
      .status,
      .summary {
        max-width: 520px;
      }

      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(5, 320px);
      }

      .plot.wide {
        grid-row: auto;
      }
    }

    @media (max-width: 580px) {
      aside,
      main {
        padding: 14px;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Langevin Trap</h1>
      <p class="subtle">调节参数后运行模拟，右侧会生成轨迹、概率密度、位置自相关和平均平方位移图。</p>

      <section class="controls" id="controls"></section>

      <div class="actions">
        <button id="run" type="button">运行模拟</button>
        <button class="icon-button" id="download" type="button" title="下载合成图片" aria-label="下载合成图片">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="status" id="status">准备就绪。</div>
      <section class="summary" id="summary"></section>
    </aside>

    <main>
      <div class="grid">
        <section class="plot wide">
          <div class="plot-title">3D trajectory</div>
          <canvas id="trajectory"></canvas>
        </section>
        <section class="plot">
          <div class="plot-title">Density x-z</div>
          <canvas id="densityXZ"></canvas>
        </section>
        <section class="plot">
          <div class="plot-title">Position ACF</div>
          <canvas id="acf"></canvas>
        </section>
        <section class="plot">
          <div class="plot-title">Fokker-Planck theory x-y</div>
          <canvas id="densityXY"></canvas>
        </section>
        <section class="plot">
          <div class="plot-title">MSD</div>
          <canvas id="msd"></canvas>
        </section>
      </div>
    </main>
  </div>

  <script>
    const controlSpecs = [
      ["kx", "kappa x", 1.0, 0.05, 8, 0.05],
      ["ky", "kappa y", 1.0, 0.05, 8, 0.05],
      ["kz", "kappa z", 0.25, 0.05, 8, 0.05],
      ["gamma", "gamma", 1.0, 0.1, 5, 0.05],
      ["diffusion", "D", 0.05, 0.001, 0.5, 0.001],
      ["dt", "dt", 0.005, 0.001, 0.05, 0.001],
      ["steps", "steps", 50000, 1000, 10000000, 1000],
      ["bins", "density bins", 90, 32, 180, 2],
      ["burnIn", "burn-in", 0.2, 0, 0.9, 0.05],
      ["seed", "seed", 7, -1, 9999, 1],
      ["x0", "initial x", 0.0, -3, 3, 0.05],
      ["y0", "initial y", 0.0, -3, 3, 0.05],
      ["z0", "initial z", 0.0, -3, 3, 0.05],
    ];

    const controls = new Map();
    const controlsRoot = document.getElementById("controls");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const canvasIds = ["trajectory", "densityXZ", "densityXY", "acf", "msd"];

    function createControls() {
      for (const [key, label, value, min, max, step] of controlSpecs) {
        const wrap = document.createElement("div");
        wrap.className = "control";

        const labelEl = document.createElement("label");
        labelEl.htmlFor = `${key}-range`;
        labelEl.textContent = label;

        const number = document.createElement("input");
        number.type = "number";
        number.id = `${key}-number`;
        number.min = min;
        number.max = max;
        number.step = step;
        number.value = value;

        const range = document.createElement("input");
        range.type = "range";
        range.id = `${key}-range`;
        range.min = min;
        range.max = max;
        range.step = step;
        range.value = value;

        const sync = (source, target) => {
          target.value = source.value;
        };
        range.addEventListener("input", () => sync(range, number));
        number.addEventListener("input", () => sync(number, range));

        wrap.append(labelEl, number, range);
        controlsRoot.append(wrap);
        controls.set(key, { range, number });
      }
    }

    function valueOf(key) {
      return Number(controls.get(key).number.value);
    }

    function paramsFromControls() {
      return {
        kappa: [valueOf("kx"), valueOf("ky"), valueOf("kz")],
        gamma: valueOf("gamma"),
        diffusion: valueOf("diffusion"),
        dt: valueOf("dt"),
        steps: Math.round(valueOf("steps")),
        bins: Math.round(valueOf("bins")),
        burnIn: valueOf("burnIn"),
        seed: Math.round(valueOf("seed")),
        initial: [valueOf("x0"), valueOf("y0"), valueOf("z0")],
      };
    }

    function mulberry32(seed) {
      let t = seed >>> 0;
      return function next() {
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }

    function gaussian(rng) {
      let u = 0;
      let v = 0;
      while (u === 0) u = rng();
      while (v === 0) v = rng();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    function simulate(params) {
      const rng = params.seed < 0 ? Math.random : mulberry32(params.seed);
      const positions = new Float64Array((params.steps + 1) * 3);
      positions[0] = params.initial[0];
      positions[1] = params.initial[1];
      positions[2] = params.initial[2];
      const noise = Math.sqrt(2 * params.diffusion * params.dt);
      for (let i = 1; i <= params.steps; i += 1) {
        const prev = (i - 1) * 3;
        const cur = i * 3;
        for (let axis = 0; axis < 3; axis += 1) {
          const drift = (params.kappa[axis] / params.gamma) * positions[prev + axis] * params.dt;
          positions[cur + axis] = positions[prev + axis] - drift + noise * gaussian(rng);
        }
      }
      return positions;
    }

    function analyze(positions, params) {
      const start = Math.floor((params.steps + 1) * params.burnIn);
      const n = params.steps + 1 - start;
      const mean = [0, 0, 0];
      const variance = [0, 0, 0];
      for (let i = start; i <= params.steps; i += 1) {
        const idx = i * 3;
        mean[0] += positions[idx];
        mean[1] += positions[idx + 1];
        mean[2] += positions[idx + 2];
      }
      for (let axis = 0; axis < 3; axis += 1) mean[axis] /= n;
      for (let i = start; i <= params.steps; i += 1) {
        const idx = i * 3;
        for (let axis = 0; axis < 3; axis += 1) {
          const delta = positions[idx + axis] - mean[axis];
          variance[axis] += delta * delta;
        }
      }
      const std = variance.map((v) => Math.sqrt(v / n));
      const sigma = params.kappa.map((k) => Math.sqrt(params.diffusion * params.gamma / k));
      return { start, n, mean, std, sigma };
    }

    function acf(positions, params, analysis) {
      const maxLag = Math.min(900, analysis.n - 1);
      const values = [];
      const denominators = [0, 0, 0];
      for (let i = analysis.start; i <= params.steps; i += 1) {
        const idx = i * 3;
        for (let axis = 0; axis < 3; axis += 1) {
          const centered = positions[idx + axis] - analysis.mean[axis];
          denominators[axis] += centered * centered;
        }
      }
      for (let lag = -maxLag; lag <= maxLag; lag += 1) {
        const absLag = Math.abs(lag);
        let sumAxis = 0;
        for (let axis = 0; axis < 3; axis += 1) {
          let numerator = 0;
          for (let i = analysis.start; i <= params.steps - absLag; i += 1) {
            const a = positions[i * 3 + axis] - analysis.mean[axis];
            const b = positions[(i + absLag) * 3 + axis] - analysis.mean[axis];
            numerator += a * b;
          }
          sumAxis += denominators[axis] > 0 ? numerator / denominators[axis] : 0;
        }
        values.push([lag * params.dt, sumAxis / 3]);
      }
      return values;
    }

    function msd(positions, params, analysis) {
      const maxLag = Math.max(1, Math.min(Math.floor(analysis.n / 2), 3000));
      const lags = new Set();
      for (let i = 0; i < 70; i += 1) {
        const t = i / 69;
        lags.add(Math.max(1, Math.round(Math.exp(Math.log(maxLag) * t))));
      }
      const values = [];
      for (const lag of [...lags].sort((a, b) => a - b)) {
        let total = 0;
        let count = 0;
        for (let i = analysis.start; i <= params.steps - lag; i += 1) {
          const a = i * 3;
          const b = (i + lag) * 3;
          const dx = positions[b] - positions[a];
          const dy = positions[b + 1] - positions[a + 1];
          const dz = positions[b + 2] - positions[a + 2];
          total += dx * dx + dy * dy + dz * dz;
          count += 1;
        }
        values.push([lag * params.dt, total / count]);
      }
      return values;
    }

    function density(positions, params, analysis, axisX, axisY) {
      const bins = params.bins;
      const grid = Array.from({ length: bins }, () => new Float64Array(bins));
      let spanX = 3 * analysis.sigma[axisX];
      let spanY = 3 * analysis.sigma[axisY];
      for (let i = analysis.start; i <= params.steps; i += 1) {
        const idx = i * 3;
        spanX = Math.max(spanX, Math.abs(positions[idx + axisX]));
        spanY = Math.max(spanY, Math.abs(positions[idx + axisY]));
      }
      spanX = Math.max(spanX, 1e-6);
      spanY = Math.max(spanY, 1e-6);
      for (let i = analysis.start; i <= params.steps; i += 1) {
        const idx = i * 3;
        const gx = Math.floor(((positions[idx + axisX] + spanX) / (2 * spanX)) * bins);
        const gy = Math.floor(((positions[idx + axisY] + spanY) / (2 * spanY)) * bins);
        if (gx >= 0 && gx < bins && gy >= 0 && gy < bins) grid[gy][gx] += 1;
      }
      return { grid: smoothGrid(grid), spanX, spanY };
    }

    function fokkerPlanckDensity(params, analysis, axisX, axisY) {
      const bins = params.bins;
      const sigmaX = analysis.sigma[axisX];
      const sigmaY = analysis.sigma[axisY];
      const spanX = Math.max(3.5 * sigmaX, 1e-6);
      const spanY = Math.max(3.5 * sigmaY, 1e-6);
      const grid = Array.from({ length: bins }, () => new Float64Array(bins));
      for (let gy = 0; gy < bins; gy += 1) {
        const y = -spanY + ((gy + 0.5) / bins) * 2 * spanY;
        for (let gx = 0; gx < bins; gx += 1) {
          const x = -spanX + ((gx + 0.5) / bins) * 2 * spanX;
          grid[gy][gx] = Math.exp(-0.5 * ((x / sigmaX) ** 2 + (y / sigmaY) ** 2)) / (2 * Math.PI * sigmaX * sigmaY);
        }
      }
      return { grid, spanX, spanY };
    }

    function smoothGrid(grid) {
      const h = grid.length;
      const w = grid[0].length;
      const kernel = [0.054, 0.244, 0.403, 0.244, 0.054];
      const temp = Array.from({ length: h }, () => new Float64Array(w));
      const out = Array.from({ length: h }, () => new Float64Array(w));
      for (let y = 0; y < h; y += 1) {
        for (let x = 0; x < w; x += 1) {
          let sum = 0;
          for (let k = -2; k <= 2; k += 1) {
            const sx = Math.min(w - 1, Math.max(0, x + k));
            sum += grid[y][sx] * kernel[k + 2];
          }
          temp[y][x] = sum;
        }
      }
      for (let y = 0; y < h; y += 1) {
        for (let x = 0; x < w; x += 1) {
          let sum = 0;
          for (let k = -2; k <= 2; k += 1) {
            const sy = Math.min(h - 1, Math.max(0, y + k));
            sum += temp[sy][x] * kernel[k + 2];
          }
          out[y][x] = sum;
        }
      }
      return out;
    }

    function setupCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      const width = Math.max(240, Math.floor(rect.width * scale));
      const height = Math.max(220, Math.floor(rect.height * scale));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, width, height);
      return { ctx, width, height, scale };
    }

    function drawFrame(ctx, width, height) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
    }

    function drawTrajectory(canvas, positions, params, analysis) {
      const { ctx, width, height } = setupCanvas(canvas);
      drawFrame(ctx, width, height);
      const pad = 44;
      const cx = width * 0.52;
      const cy = height * 0.53;
      let span = Math.max(1, ...analysis.sigma.map((s) => 2.7 * s));
      for (let i = 0; i <= params.steps; i += Math.max(1, Math.floor(params.steps / 3500))) {
        const idx = i * 3;
        span = Math.max(span, Math.abs(positions[idx]), Math.abs(positions[idx + 1]), Math.abs(positions[idx + 2]));
      }
      const scale = Math.min(width - pad * 2, height - pad * 2) / (span * 3.2);

      function project(x, y, z) {
        const px = (x - y) * 0.86;
        const py = z + (x + y) * 0.33;
        return [cx + px * scale, cy - py * scale];
      }

      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 1;
      [["x", span, 0, 0], ["y", 0, span, 0], ["z", 0, 0, span]].forEach(([label, x, y, z]) => {
        const a = project(-x, -y, -z);
        const b = project(x, y, z);
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
        ctx.fillStyle = "#475569";
        ctx.font = `${12 * (window.devicePixelRatio || 1)}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText(label, b[0], b[1] - 6 * (window.devicePixelRatio || 1));
      });

      ctx.strokeStyle = "#334155";
      ctx.lineWidth = Math.max(1, window.devicePixelRatio || 1);
      ctx.beginPath();
      const stride = Math.max(1, Math.floor(params.steps / 4200));
      for (let i = 0; i <= params.steps; i += stride) {
        const idx = i * 3;
        const [x, y] = project(positions[idx], positions[idx + 1], positions[idx + 2]);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      const start = project(positions[0], positions[1], positions[2]);
      const end = project(positions[params.steps * 3], positions[params.steps * 3 + 1], positions[params.steps * 3 + 2]);
      drawDot(ctx, start[0], start[1], "#2563eb");
      drawDot(ctx, end[0], end[1], "#dc2626");
      drawLegend(ctx, width, height, [["start", "#2563eb"], ["end", "#dc2626"]]);
    }

    function drawDot(ctx, x, y, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 5 * (window.devicePixelRatio || 1), 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLegend(ctx, width, height, items) {
      const scale = window.devicePixelRatio || 1;
      ctx.font = `${12 * scale}px system-ui`;
      ctx.textBaseline = "middle";
      let x = width - 96 * scale;
      const y = height - 22 * scale;
      for (const [label, color] of items) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, 4 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#475569";
        ctx.fillText(label, x + 8 * scale, y);
        x += 48 * scale;
      }
    }

    function colorRamp(t, palette) {
      t = Math.max(0, Math.min(1, t));
      const stops = palette === "magma"
        ? [[22, 20, 46], [98, 26, 88], [184, 53, 88], [246, 151, 84], [252, 244, 168]]
        : [[15, 42, 67], [23, 88, 111], [40, 133, 106], [107, 179, 85], [239, 230, 101]];
      const p = t * (stops.length - 1);
      const i = Math.min(stops.length - 2, Math.floor(p));
      const f = p - i;
      const a = stops[i];
      const b = stops[i + 1];
      return [
        Math.round(a[0] + (b[0] - a[0]) * f),
        Math.round(a[1] + (b[1] - a[1]) * f),
        Math.round(a[2] + (b[2] - a[2]) * f),
      ];
    }

    function drawDensity(canvas, densityData, palette, xLabel, yLabel) {
      const { ctx, width, height } = setupCanvas(canvas);
      drawFrame(ctx, width, height);
      const scale = window.devicePixelRatio || 1;
      const padL = 48 * scale;
      const padR = 18 * scale;
      const padT = 40 * scale;
      const padB = 38 * scale;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;
      const bins = densityData.grid.length;
      let max = 0;
      for (const row of densityData.grid) {
        for (const v of row) max = Math.max(max, v);
      }
      const image = ctx.createImageData(plotW, plotH);
      for (let py = 0; py < plotH; py += 1) {
        for (let px = 0; px < plotW; px += 1) {
          const gx = Math.floor((px / plotW) * bins);
          const gy = bins - 1 - Math.floor((py / plotH) * bins);
          const v = max > 0 ? densityData.grid[gy][gx] / max : 0;
          const [r, g, b] = colorRamp(Math.sqrt(v), palette);
          const offset = (py * plotW + px) * 4;
          image.data[offset] = r;
          image.data[offset + 1] = g;
          image.data[offset + 2] = b;
          image.data[offset + 3] = 255;
        }
      }
      ctx.putImageData(image, padL, padT);
      drawAxes(ctx, width, height, padL, padT, plotW, plotH, xLabel, yLabel, {
        xMin: -densityData.spanX,
        xMax: densityData.spanX,
        yMin: -densityData.spanY,
        yMax: densityData.spanY,
      });
      const zeroX = padL + plotW / 2;
      const zeroY = padT + plotH / 2;
      ctx.strokeStyle = "rgba(255,255,255,0.72)";
      ctx.lineWidth = 1 * scale;
      ctx.beginPath();
      ctx.moveTo(zeroX, padT);
      ctx.lineTo(zeroX, padT + plotH);
      ctx.moveTo(padL, zeroY);
      ctx.lineTo(padL + plotW, zeroY);
      ctx.stroke();
    }

    function formatTick(value) {
      if (Math.abs(value) < 1e-12) return "0";
      if (Math.abs(value) >= 10 || Math.abs(value) < 0.01) return value.toExponential(1);
      return value.toPrecision(2);
    }

    function drawAxes(ctx, width, height, x, y, w, h, xLabel, yLabel, ranges = null) {
      const scale = window.devicePixelRatio || 1;
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1 * scale;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#475569";
      ctx.font = `${12 * scale}px system-ui`;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(xLabel, x + w / 2, height - 12 * scale);
      if (ranges) {
        ctx.font = `${10 * scale}px system-ui`;
        ctx.textBaseline = "top";
        [[ranges.xMin, x], [0, x + w / 2], [ranges.xMax, x + w]].forEach(([value, px]) => {
          ctx.fillText(formatTick(value), px, y + h + 4 * scale);
        });
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        [[ranges.yMin, y + h], [0, y + h / 2], [ranges.yMax, y]].forEach(([value, py]) => {
          ctx.fillText(formatTick(value), x - 5 * scale, py);
        });
      }
      ctx.fillStyle = "#475569";
      ctx.font = `${12 * scale}px system-ui`;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.save();
      ctx.translate(14 * scale, y + h / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(yLabel, 0, 0);
      ctx.restore();
    }

    function drawLinePlot(canvas, data, options) {
      const { ctx, width, height } = setupCanvas(canvas);
      drawFrame(ctx, width, height);
      const scale = window.devicePixelRatio || 1;
      const padL = 50 * scale;
      const padR = 20 * scale;
      const padT = 42 * scale;
      const padB = 40 * scale;
      const w = width - padL - padR;
      const h = height - padT - padB;
      const xs = data.map((d) => options.logX ? Math.log10(Math.max(d[0], 1e-12)) : d[0]);
      const ys = data.map((d) => options.logY ? Math.log10(Math.max(d[1], 1e-12)) : d[1]);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      let minY = Math.min(...ys);
      let maxY = Math.max(...ys);
      if (options.yZero) {
        minY = Math.min(minY, 0);
        maxY = Math.max(maxY, 0);
      }
      if (minY === maxY) {
        minY -= 1;
        maxY += 1;
      }
      const px = (x) => padL + ((x - minX) / Math.max(maxX - minX, 1e-12)) * w;
      const py = (y) => padT + h - ((y - minY) / (maxY - minY)) * h;
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 1 * scale;
      for (let i = 0; i <= 4; i += 1) {
        const yy = padT + (h * i) / 4;
        ctx.beginPath();
        ctx.moveTo(padL, yy);
        ctx.lineTo(padL + w, yy);
        ctx.stroke();
      }
      drawAxes(ctx, width, height, padL, padT, w, h, options.xLabel, options.yLabel);
      if (options.zeroLine && minY <= 0 && maxY >= 0) {
        ctx.strokeStyle = "#94a3b8";
        ctx.beginPath();
        ctx.moveTo(padL, py(0));
        ctx.lineTo(padL + w, py(0));
        ctx.stroke();
      }
      if (options.plateau) {
        const p = options.logY ? Math.log10(options.plateau) : options.plateau;
        ctx.strokeStyle = "#b45309";
        ctx.setLineDash([6 * scale, 5 * scale]);
        ctx.beginPath();
        ctx.moveTo(padL, py(p));
        ctx.lineTo(padL + w, py(p));
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.strokeStyle = options.color || "#334155";
      ctx.lineWidth = 1.5 * scale;
      ctx.beginPath();
      data.forEach((d, i) => {
        const x = px(options.logX ? Math.log10(Math.max(d[0], 1e-12)) : d[0]);
        const y = py(options.logY ? Math.log10(Math.max(d[1], 1e-12)) : d[1]);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function render() {
      const params = paramsFromControls();
      statusEl.textContent = "运行中...";
      window.requestAnimationFrame(() => {
        const t0 = performance.now();
        const positions = simulate(params);
        const analysis = analyze(positions, params);
        const densityXZ = density(positions, params, analysis, 0, 2);
        const densityXY = fokkerPlanckDensity(params, analysis, 0, 1);
        const acfData = acf(positions, params, analysis);
        const msdData = msd(positions, params, analysis);
        const plateau = 2 * analysis.sigma.reduce((sum, s) => sum + s * s, 0);

        drawTrajectory(document.getElementById("trajectory"), positions, params, analysis);
        drawDensity(document.getElementById("densityXZ"), densityXZ, "magma", "x", "z");
        drawDensity(document.getElementById("densityXY"), densityXY, "viridis", "x", "y");
        drawLinePlot(document.getElementById("acf"), acfData, { xLabel: "lag", yLabel: "ACF [n.u.]", yZero: true, zeroLine: true, color: "#1f2937" });
        drawLinePlot(document.getElementById("msd"), msdData, { xLabel: "lag", yLabel: "MSD", logX: true, logY: true, plateau, color: "#475569" });

        const finalIdx = params.steps * 3;
        const energy = 0.5 * (
          params.kappa[0] * positions[finalIdx] ** 2 +
          params.kappa[1] * positions[finalIdx + 1] ** 2 +
          params.kappa[2] * positions[finalIdx + 2] ** 2
        );
        summaryEl.innerHTML = [
          ["duration", (params.steps * params.dt).toPrecision(5)],
          ["samples", analysis.n.toString()],
          ["final energy", energy.toPrecision(5)],
          ["measured std", analysis.std.map((v) => v.toFixed(4)).join(", ")],
          ["theory std", analysis.sigma.map((v) => v.toFixed(4)).join(", ")],
        ].map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`).join("");
        statusEl.textContent = `完成，用时 ${(performance.now() - t0).toFixed(0)} ms。`;
      });
    }

    function downloadComposite() {
      const scale = window.devicePixelRatio || 1;
      const source = canvasIds.map((id) => document.getElementById(id));
      const width = 1600;
      const height = 1000;
      const out = document.createElement("canvas");
      out.width = width;
      out.height = height;
      const ctx = out.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      const boxes = [
        [0, 0, 560, 1000],
        [560, 0, 520, 500],
        [1080, 0, 520, 500],
        [560, 500, 520, 500],
        [1080, 500, 520, 500],
      ];
      source.forEach((canvas, i) => {
        const [x, y, w, h] = boxes[i];
        ctx.drawImage(canvas, x, y, w, h);
      });
      const link = document.createElement("a");
      link.download = "langevin_trap_web_result.png";
      link.href = out.toDataURL("image/png");
      link.click();
    }

    createControls();
    document.getElementById("run").addEventListener("click", render);
    document.getElementById("download").addEventListener("click", downloadComposite);
    window.addEventListener("resize", () => window.requestAnimationFrame(render));
    render();
  </script>
</body>
</html>
